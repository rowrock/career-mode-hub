<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Mode Hub</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0f14;
    color:#f5f7fa;
}

button,input,select{font-family:inherit}
button{cursor:pointer}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:235px;
    background:#11161d;
    border-right:1px solid #252c35;

.logo{

.nav-title{

}

.nav-btn{
    width:100%;
    background:transparent;
    border:0;
    color:#9ca5b1;
    text-align:left;
    padding:11px 12px;

}

}

}

.main{

}

.topbar{

}

<body>

<aside class="sidebar">

<div class="logo">
Career Mode <span>Hub</span>
</div>

<div class="nav-title">Career</div>

<button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
Dashboard
</button>

<div id="careerNavigation">

<button class="nav-btn disabled" data-page="mycareer" onclick="showPage('mycareer')">
My Career
</button>

<button class="nav-btn disabled" data-page="calendar" onclick="showPage('calendar')">
Calendar
</button>

<button class="nav-btn disabled" data-page="matches" onclick="showPage('matches')">
Matches
</button>

<button class="nav-btn disabled" data-page="squad" onclick="showPage('squad')">
Squad
</button>

<button class="nav-btn disabled" data-page="players" onclick="showPage('players')">
Players
</button>

<button class="nav-btn disabled" data-page="youth" onclick="showPage('youth')">
Youth Academy
</button>

<button class="nav-btn disabled" data-page="transfers" onclick="showPage('transfers')">
Transfers
</button>

<button class="nav-btn disabled" data-page="competitions" onclick="showPage('competitions')">
Competitions
</button>

<button class="nav-btn disabled" data-page="league" onclick="showPage('league')">
League Centre
</button>

<button class="nav-btn disabled" data-page="past" onclick="showPage('past')">
Past Seasons
</button>

<button class="nav-btn disabled" data-page="trophies" onclick="showPage('trophies')">
Trophy Cabinet
</button>

National Team
</button>

<main class="main">
<div id="pageContent"></div>
</main>

<div id="modalContainer"></div>

<script>

/* =========================================================
   GLOBALS
========================================================= */

let allPlayers=[];
let fc27Leagues=[];
let fc27ClubsByLeague={};

let careers=[];
let currentCareerId=null;

let setupClubType="original";
let selectedLeague="";
let selectedClub="";
let selectedCountry="";
let selectedContinent="";

let manualPlayers=[];
let selectedSeasonTeams=[];

let calendarUploadFiles=[];
let matchUploadFiles=[];
let aiReviewData=null;
let aiReviewFiles=[];


/* =========================================================
   STORAGE
========================================================= */

function loadCareers(){

    try{

        const saved=localStorage.getItem("careerModeHubCareers");

        if(saved){
            careers=JSON.parse(saved);
        }

        careers.forEach(c=>{

            if(!Array.isArray(c.matches))
                c.matches=[];

            if(!Array.isArray(c.squad))
                c.squad=[];

            if(!Array.isArray(c.transfers))
                c.transfers=[];

            if(!Array.isArray(c.trophies))
                c.trophies=[];

            if(!Array.isArray(c.calendar))
                c.calendar=[];

            if(!Array.isArray(c.seasons))
                c.seasons=[];
            c.seasons.forEach(season=>{if(!Array.isArray(season.leagueResults))season.leagueResults=[];});

            if(!c.currentSeason)
                c.currentSeason="2026/27";

            if(!c.seasonNumber)
                c.seasonNumber=1;

        });

    }catch(e){

        careers=[];

    }
}


function saveCareers(){

    localStorage.setItem(
        "careerModeHubCareers",
        JSON.stringify(careers)
    );
}


function getCurrentCareer(){

    return careers.find(
        c=>c.id===currentCareerId
    );
}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){

    if(page!=="dashboard" && !currentCareerId){

        renderDashboard();
        return;

    }

    document.querySelectorAll(".nav-btn").forEach(btn=>{

        btn.classList.remove("active");

        if(btn.dataset.page===page)
            btn.classList.add("active");

    });

    if(page==="dashboard")
        renderDashboard();

    else if(page==="mycareer")
        renderCareerHome();

    else if(page==="calendar")
        renderCalendar();

    else if(page==="matches")
        renderMatches();

    else if(page==="players")
        renderPlayers();

function createCareer(){

    const manager=document.getElementById("managerName").value.trim();

    if(!manager){
        alert("Please enter a manager name.");
        return;
    }

    if(!selectedLeague){
        alert("Please select a league.");
        return;
    }

    let club="";

    if(setupClubType==="original"){

        if(!selectedClub){
            alert("Please select a club.");
            return;
        }

        club=selectedClub;

    }else{

        club=document.getElementById("customClubName").value.trim();

        if(!club){
            alert("Please enter your custom club name.");
            return;
        }
    }

    const nationalChoice=
        document.getElementById("nationalTeamChoice").value;

    if(nationalChoice==="add"&&!selectedCountry){
        alert("Please select a national team.");
        return;
    }

    const career={

        id:createId(),

        managerName:manager,

        clubType:setupClubType,

        clubName:club,

        league:selectedLeague,

        currentSeason:"2026/27",

        seasonNumber:1,

        nationalTeam:
            nationalChoice==="add"
            ?selectedCountry
            :null,

        continent:
            nationalChoice==="add"
            ?selectedContinent
            :null,

        matches:[],
        calendar:[],
        transfers:[],
        trophies:[],
        squad:[],
        youthAcademy:[],

        seasons:[{

            season:"2026/27",

            league:selectedLeague,

            leagueTeams:[],

            competitions:[],

            calendarUploaded:false

        }]

    };

    careers.push(career);

    saveCareers();

    enterCareer(career.id);

    /*
     * Immediately ask which teams are in the league.
     */

    setTimeout(
        ()=>openSeasonSetup(true),
        100
    );
}

function getSeason(career){

    if(!career)return null;

    if(!Array.isArray(career.seasons))
        career.seasons=[];

    let season=career.seasons.find(
        x=>x.season===career.currentSeason
    );

    if(!season){

        season={
            season:career.currentSeason,
            league:career.league,
            leagueTeams:[],
            competitions:[],
            calendarUploaded:false
        };

        career.seasons.push(season);
    }

    if(!Array.isArray(season.leagueTeams))
        season.leagueTeams=[];

    if(!Array.isArray(season.competitions))
        season.competitions=[];
    if(!Array.isArray(season.leagueResults))
        season.leagueResults=[];

    return season;
}

function getCalendarTeamOptions(currentValue=""){
    const teams=new Set();
    Object.values(fc27ClubsByLeague||{}).forEach(clubs=>{
        (clubs||[]).forEach(club=>{if(club)teams.add(club);});
    });
    // Keep any already-saved opponent available even if it is missing from the database.
    if(currentValue)teams.add(currentValue);
    return Array.from(teams).sort((a,b)=>a.localeCompare(b));
}


function getCalendarCompetitionOptions(currentValue=""){
    const options=new Set([
        ...fc27Leagues,
        ...competitions,
        "Domestic Cup",
        "League Cup",
        "International Friendly",
        "World Cup",
        "European Championship",
        "Other"
    ]);
    if(currentValue)options.add(currentValue);
    return Array.from(options).sort((a,b)=>a.localeCompare(b));
}


const competitions=[

"Premier League",
"FA Cup",
"Carabao Cup",
"UEFA Champions League",
"UEFA Europa League",
"UEFA Conference League",
"La Liga",
"Bundesliga",
"Serie A",
"Ligue 1",
"International Friendly",
"UEFA Nations League",
"World Cup",
"European Championship",
"Other"

];


function getCompetitionTeams(competition){

    const career=getCurrentCareer();

    if(!career)return[];

    const season=getSeason(career);

    if(
        competition==="Premier League"
        ||
        competition===career.league
    ){

        return season.leagueTeams||[];
    }

    /*
     * English domestic cups:
     * use the full FC27 database of English clubs.
     */

    if(
        competition==="FA Cup"
        ||
        competition==="Carabao Cup"
    ){

        return getEnglishClubs();
    }

    /*
     * International competitions.
     */

    if(
        competition==="International Friendly"
        ||
        competition==="UEFA Nations League"
        ||
        competition==="World Cup"
        ||
        competition==="European Championship"
    ){

        return countriesByContinent.Europe
            .concat(
                countriesByContinent.SouthAmerica,
                countriesByContinent.NorthAmerica,
                countriesByContinent.Africa,
                countriesByContinent.Asia,
                countriesByContinent.Oceania
            )
            .filter(
                (x,i,a)=>a.indexOf(x)===i
            );
    }

    /*
     * European competitions:
     * use all clubs from the database.
     */

    if(
        competition==="UEFA Champions League"
        ||
        competition==="UEFA Europa League"
        ||
        competition==="UEFA Conference League"
    ){

        return getAllClubs();
    }

    /*
     * Major domestic leagues.
     */

    if(
        [
            "La Liga",
            "Bundesliga",
            "Serie A",
            "Ligue 1"
        ].includes(competition)
    ){

        const possibleLeague={
            "La Liga":"La Liga",
            "Bundesliga":"Bundesliga",
            "Serie A":"Serie A",
            "Ligue 1":"Ligue 1"
        }[competition];

        return fc27ClubsByLeague[possibleLeague]||[];
    }

    return getAllClubs();
}


function getAllClubs(){

    const clubs=new Set();

    allPlayers.forEach(
        player=>{
            if(player.club)
                clubs.add(player.club);
        }
    );

    return Array.from(clubs).sort();
}


function getEnglishClubs(){

    const clubs=new Set();

    allPlayers.forEach(player=>{

        const league=(player.league||"").toLowerCase();

        if(
            league.includes("premier")
            ||
            league.includes("championship")
            ||
            league.includes("league one")
            ||
            league.includes("league two")
            ||
            league.includes("national")
            ||
            league.includes("england")
        ){

            if(player.club)
                clubs.add(player.club);
        }

    });

    return Array.from(clubs).sort();
}

    const goalsFor=
        Number(
            document.getElementById("goalsFor").value||0
        );

    const goalsAgainst=
        Number(
            document.getElementById("goalsAgainst").value||0
        );

    let result="D";

    if(goalsFor>goalsAgainst)
        result="W";

    if(goalsFor<goalsAgainst)
        result="L";

    const players=[];

    document.querySelectorAll("#manualPlayers .player-entry").forEach(row=>{
        const get=field=>row.querySelector('[data-field="'+field+'"]')?.value??"";

            goals:number(get("goals"))??0,
            assists:number(get("assists"))??0,
            minutes:number(get("minutes")),
            saves:number(get("saves")),
            yellowCards:number(get("yellowCards"))??0,
            redCards:number(get("redCards"))??0,
            cards:(Number(get("redCards"))>0?"Red":Number(get("yellowCards"))>0?"Yellow":null)
        });
    });

    career.matches.push({

        id:createId(),

        season:career.currentSeason,

        homeAway:

        opponent,

        goalsFor,

        goalsAgainst,

        result,

        entryMethod:"manual",

        players

function getCareerClubRoster(career){
    const clubName=String(career?.clubName||"").trim().toLowerCase();
    if(!clubName||!Array.isArray(allPlayers))return [];
    let roster=allPlayers.filter(p=>String(p.club||"").trim().toLowerCase()===clubName);
    if(!roster.length){
        const normal=value=>String(value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
        const target=normal(clubName);
        roster=allPlayers.filter(p=>{
            const club=normal(p.club);
            return club&&target&&(club===target||club.includes(target)||target.includes(club));
        });
    }
    return roster;
}

function matchRosterPlayer(name,roster){
    const normal=value=>String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    const wanted=normal(name);
    if(!wanted)return null;
    let found=roster.find(p=>{
        const names=[p.commonName,[p.firstName,p.lastName].filter(Boolean).join(" "),p.firstName,p.lastName]
            .map(normal).filter(Boolean);
        return names.includes(wanted);
    });
    if(found)return found;
    return roster.find(p=>{
        const names=[p.commonName,[p.firstName,p.lastName].filter(Boolean).join(" ")]
            .map(normal).filter(Boolean);
        return names.some(n=>n.length>4&&(n.includes(wanted)||wanted.includes(n)));
    })||null;
}

function officialPlayerName(player){
    return player.commonName||[player.firstName,player.lastName].filter(Boolean).join(" ")||"";
}

function openAIMatchReview(data,filenames){

    else if(norm(awayTeam)===club)homeAway="Away";

function syncAIMatchScorersToGoalColumns(){

    const roster=window.__careerAIReviewRoster||[];
    const counts={};
    names.forEach(name=>{
        const player=matchRosterPlayer(name,roster);
        if(player){
            const official=officialPlayerName(player);
            counts[official]=(counts[official]||0)+1;
        }
    });
    document.querySelectorAll("#aiReviewPlayerRows [data-ai-player]").forEach(row=>{
        const nameInput=row.querySelector('[data-ai-field="name"]');

    const gf=Number(goalsFor),ga=Number(goalsAgainst);
    let players;
    try{players=saveAIReviewPlayerInputs();}catch(error){return;}
    const scorerText=document.getElementById("aiMatchScorers")?.value||"";

            const official=officialPlayerName(player);
            scorerCounts[official]=(scorerCounts[official]||0)+1;
        }
    });
    players=players.map(p=>({
        ...p,
        goals:scorerCounts[p.name]!==undefined?scorerCounts[p.name]:p.goals
    }));
    career.matches.push({
        id:createId(),season:career.currentSeason,
        date,competition,
        homeAway:document.getElementById("aiMatchHomeAway").value,
        opponent,goalsFor:gf,goalsAgainst:ga,
        result:gf>ga?"W":gf<ga?"L":"D",
        cleanSheet:ga===0,entryMethod:"ai",
        screenshots:aiReviewFiles.slice(),
        scorers,
        players
    });
    saveCareers();
    matchUploadFiles=[];
    closeModal();
    renderMatches();
}

function competitionTheme(competition){

    const c=(competition||"").toLowerCase();

    if(c.includes("premier"))
        return "theme-premier";

    if(c.includes("fa cup"))
        return "theme-fa";

    if(c.includes("carabao"))
        return "theme-carabao";

    if(c.includes("champions"))
        return "theme-champions";

    if(c.includes("europa"))
        return "theme-europa";

    if(c.includes("conference"))
        return "theme-conference";

    if(c.includes("la liga"))
        return "theme-la-liga";

    if(c.includes("bundesliga"))
        return "theme-bundesliga";

    if(c.includes("serie"))
        return "theme-seriea";

    if(c.includes("ligue"))
        return "theme-ligue1";

    if(c.includes("friendly"))
        return "theme-friendly";

    if(c.includes("world cup"))
        return "theme-worldcup";

    if(
        c.includes("international")
        ||
        c.includes("nations")
        ||
        c.includes("european championship")
    )
        return "theme-international";

    return "theme-friendly";
}

function saveAICalendarReview(){
    const career=getCurrentCareer();
    if(!career)return;
    const rows=document.querySelectorAll("#aiCalendarReviewRows [data-ai-calendar]");
    const extracted=[];
    rows.forEach(row=>{
        const get=field=>row.querySelector('[data-event-field="'+field+'"]')?.value.trim()||"";
        const event={date:get("date"),competition:get("competition"),opponent:get("opponent"),homeAway:get("homeAway"),round:get("round"),notes:get("notes")};
        if(event.date&&event.competition&&event.opponent)extracted.push(event);
    });
    if(!extracted.length){
        alert("Add at least one fixture with a date, competition and opponent.");
        return;
    }
    if(!Array.isArray(career.calendar))career.calendar=[];
    const existing=new Set(career.calendar.map(e=>[e.date,e.competition,e.opponent].join("|").toLowerCase()));
    let added=0;
    extracted.forEach(event=>{
        const key=[event.date,event.competition,event.opponent].join("|").toLowerCase();
        if(existing.has(key))return;
        existing.add(key);
        career.calendar.push({
            id:createId(),season:career.currentSeason,
            date:event.date,competition:event.competition,
            opponent:event.opponent,homeAway:event.homeAway,
            round:event.round,notes:event.notes,
            favorite:false,source:"ai",
            screenshots:aiReviewFiles.slice()
        });
        added++;
    });
    const season=getSeason(career);
    if(season)season.calendarUploaded=true;
    saveCareers();
    calendarUploadFiles=[];
    closeModal();
    renderCalendar();
    if(added===0)alert("No new fixtures were added because all reviewed fixtures were already in your calendar.");
    else if(added<extracted.length)alert(`Saved ${added} new fixtures. Duplicate fixtures were skipped.`);
}

/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    const rows=[];
    let row=[];
    let value="";
    let insideQuotes=false;

    for(let i=0;i<text.length;i++){

        const char=text[i];
        const next=text[i+1];

        if(char==='"'&&insideQuotes&&next==='"'){
            value+='"';
            i++;
            continue;
        }

        if(char==='"'){
            insideQuotes=!insideQuotes;
            continue;
        }

        if(char===","&&!insideQuotes){

            row.push(value);
            value="";
            continue;
        }

        if(
            (char==="\n"||char==="\r")
            &&
            !insideQuotes
        ){

            if(char==="\r"&&next==="\n")
                i++;

            row.push(value);
            value="";

            if(row.some(x=>x.trim()!==""))
                rows.push(row);

            row=[];

            continue;
        }

        value+=char;
    }

    if(value!==""||row.length){

        row.push(value);

        if(row.some(x=>x.trim()!==""))
            rows.push(row);
    }

    if(!rows.length)
        return[];

    const headers=rows[0].map(x=>x.trim());

    return rows.slice(1).map(row=>{

        const obj={};

        headers.forEach(
            (header,i)=>{
                obj[header]=
                    row[i]!==undefined
                    ?row[i].trim()
                    :"";
            }
        );

        return obj;
    });
}


function getPlayerValue(row,names){

    for(const name of names){

        if(
            row[name]!==undefined
            &&
            row[name]!==""
        )
            return row[name];
    }

    return "";
}


function calculateAge(birthdate){

    if(!birthdate)return"";

    const date=new Date(birthdate);

    if(isNaN(date.getTime()))
        return"";

    const now=new Date();

    let age=
        now.getFullYear()-
        date.getFullYear();

    const month=
        now.getMonth()-
        date.getMonth();

    if(
        month<0
        ||
        (
            month===0
            &&
            now.getDate()<date.getDate()
        )
    )
        age--;

    return age;
}


function convertPlayer(row){

    return{

        id:getPlayerValue(row,["id"]),

        rank:getPlayerValue(row,["rank"]),

        overallRating:getPlayerValue(
            row,
            ["overallRating","overall","rating"]
        ),

        firstName:getPlayerValue(
            row,
            ["firstName","first_name"]
        ),

        lastName:getPlayerValue(
            row,
            ["lastName","last_name"]
        ),

        commonName:getPlayerValue(
            row,
            ["commonName","common_name"]
        ),

        birthdate:getPlayerValue(
            row,
            ["birthdate"]
        ),

        age:calculateAge(
            getPlayerValue(row,["birthdate"])
        ),

        league:getPlayerValue(
            row,
            ["leagueName","league"]
        ),

        club:getPlayerValue(
            row,
            ["team","club"]
        ),

        nationality:getPlayerValue(
            row,
            ["nationality"]
        ),

        position:getPlayerValue(
            row,
            ["positionShort","position"]
        ),

        preferredFoot:getPlayerValue(
            row,
            ["preferredFoot"]
        ),

        avatarUrl:getPlayerValue(
            row,
            ["avatarUrl"]
        ),

        shieldUrl:getPlayerValue(
            row,
            ["shieldUrl"]
        )
    };
}


function buildFC27LeagueDatabase(){

    const leagueSet=new Set();
    const clubsByLeague={};

    allPlayers.forEach(player=>{

        const league=player.league;
        const club=player.club;

        if(!league)return;

        leagueSet.add(league);

        if(!clubsByLeague[league])
            clubsByLeague[league]=new Set();

        if(club)
            clubsByLeague[league].add(club);
    });

    fc27Leagues=
        Array.from(leagueSet)
        .sort((a,b)=>a.localeCompare(b));

    fc27ClubsByLeague={};

    Object.keys(clubsByLeague).forEach(
        league=>{

            fc27ClubsByLeague[league]=
                Array.from(
                    clubsByLeague[league]
                ).sort(
                    (a,b)=>a.localeCompare(b)
                );
        }
    );
}


async function loadDatabase(){

    try{

        const response=
            await fetch(
                "data/players.csv?cache="+Date.now()
            );

        if(!response.ok)
            throw new Error("CSV failed");

        const text=await response.text();

        const rows=parseCSV(text);

        allPlayers=rows.map(convertPlayer);

        buildFC27LeagueDatabase();

        console.log(
            "FC27 players loaded:",
            allPlayers.length
        );

    }catch(error){

        console.error(
            "Player database error:",
            error
        );
    }
}

// Public Worker URL only. The OpenRouter API key stays in Cloudflare.
const CAREER_AI_URL = "https://career-mode-ai.rowanpetersen209.workers.dev/";

function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(new Error("Could not read screenshot."));
        reader.readAsDataURL(file);
    });
}

async function analyseCareerScreenshots(task,files){
    if(!["match","calendar","league"].includes(task))
        throw new Error("Unknown AI task.");
    if(!files||files.length<1||files.length>4)
        throw new Error("Choose between 1 and 4 screenshots at a time.");
    const images=[];
    let total=0;
    for(const file of Array.from(files)){
        if(!["image/png","image/jpeg","image/webp"].includes(file.type))
            throw new Error("Use PNG, JPEG or WebP screenshots.");
        if(file.size>8*1024*1024)
            throw new Error("A screenshot is over 8 MB. Please resize it.");
        const data=await fileToDataURL(file);
        total+=data.length;
        if(total>12_000_000)
            throw new Error("These screenshots are too large together. Upload fewer screenshots at a time.");
        images.push(data);
    }
    let response;
    try{
        response=await fetch(CAREER_AI_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({task,images,clubName:getCurrentCareer()?.clubName||""})
        });
    }catch(e){
        throw new Error("Could not reach the Cloudflare Worker. Check its URL and deployment.");
    }
    let result;
    try{result=await response.json();}
    catch(e){throw new Error("The AI server returned an unreadable response.");}
    if(!response.ok||!result.ok)
        throw new Error(result.error||("AI request failed ("+response.status+")."));
    if(!result.data||typeof result.data!=="object")
        throw new Error("AI returned no usable extracted data.");
    return result.data;
}

function createId(){

function todayDate(){

    return new Date()
        .toISOString()
        .split("T")[0];
}


function formatDate(dateString){

    if(!dateString)return"—";

    const date=new Date(
        dateString+"T00:00:00"
    );

    if(isNaN(date.getTime()))
        return dateString;

    return date.toLocaleDateString(
        "en-AU",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}


function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJS(value){

    return String(value??"")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}
