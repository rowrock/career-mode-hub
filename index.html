<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Mode Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #f5f7fa;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 230px;
    background: #11161d;
    border-right: 1px solid #252c35;
    padding: 24px 14px;
    z-index: 10;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    padding: 8px 12px 25px;
}

.logo span {
    color: #4da3ff;
}

.nav-title {
    color: #707986;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0 12px 8px;
    letter-spacing: 1px;
}

.nav-btn {
    width: 100%;
    background: transparent;
    border: 0;
    color: #9ca5b1;
    text-align: left;
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 3px;
    font-size: 14px;
}

.nav-btn:hover {
    background: #1a2028;
    color: white;
}

.nav-btn.active {
    background: #1d2835;
    color: white;
    font-weight: 700;
}

.nav-btn.disabled {
    opacity: 0.55;
}

/* =========================
   MAIN
========================= */

.main {
    margin-left: 230px;
    min-height: 100vh;
    padding: 32px 38px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-title {
    font-size: 28px;
    font-weight: 800;
}

.page-subtitle {
    color: #7f8996;
    margin-top: 5px;
    font-size: 14px;
}

/* =========================
   DASHBOARD
========================= */

.careers-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.primary-btn {
    background: #3288e8;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
}

.primary-btn:hover {
    background: #2576d0;
}

.secondary-btn {
    background: #1a2028;
    color: #e7ebf0;
    border: 1px solid #303844;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: 600;
}

.secondary-btn:hover {
    background: #222a34;
}

.careers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
}

.career-card {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 20px;
    transition: 0.15s;
}

.career-card:hover {
    border-color: #3b4653;
    transform: translateY(-2px);
}

.career-card-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.career-name {
    font-size: 19px;
    font-weight: 800;
}

.career-club {
    color: #d8dde4;
    margin-top: 5px;
}

.career-league {
    color: #7f8996;
    font-size: 13px;
    margin-top: 3px;
}

.career-season {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #252c35;
    display: flex;
    justify-content: space-between;
    color: #8d97a3;
    font-size: 13px;
}

.season-value {
    color: white;
    font-weight: 700;
}

.career-actions {
    display: flex;
    gap: 8px;
    margin-top: 17px;
}

.career-actions button {
    flex: 1;
}

.delete-btn {
    background: transparent;
    border: 1px solid #493038;
    color: #d97886;
    padding: 9px;
    border-radius: 7px;
}

.delete-btn:hover {
    background: #24161a;
}

.empty-state {
    background: #11161d;
    border: 1px dashed #303844;
    border-radius: 12px;
    padding: 55px 20px;
    text-align: center;
    color: #7f8996;
}

.empty-state h2 {
    color: white;
    margin-top: 0;
}

/* =========================
   CAREER HEADER
========================= */

.career-banner {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 24px;
}

.career-banner-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.current-career-label {
    color: #737d89;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
}

.current-career-name {
    font-size: 22px;
    font-weight: 800;
    margin-top: 4px;
}

.current-career-info {
    color: #8d97a3;
    font-size: 13px;
    margin-top: 5px;
}

.back-dashboard {
    background: #1a2028;
    border: 1px solid #303844;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
}

/* =========================
   CARDS
========================= */

.panel {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 22px;
}

.panel-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 5px;
}

.panel-subtitle {
    color: #7f8996;
    font-size: 13px;
    margin-bottom: 20px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat-box {
    background: #171d25;
    border: 1px solid #252c35;
    border-radius: 9px;
    padding: 18px;
}

.stat-label {
    color: #7f8996;
    font-size: 12px;
}

.stat-value {
    font-size: 26px;
    font-weight: 800;
    margin-top: 8px;
}

/* =========================
   SETUP
========================= */

.setup-wrapper {
    max-width: 760px;
}

.setup-panel {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 28px;
}

.setup-section {
    margin-bottom: 28px;
}

.setup-section:last-child {
    margin-bottom: 0;
}

.setup-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
}

.setup-help {
    color: #727c88;
    font-size: 12px;
    margin-top: 6px;
}

.type-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.type-btn {
    background: #171d25;
    border: 1px solid #303844;
    color: #cdd3db;
    border-radius: 9px;
    padding: 17px;
    text-align: left;
}

.type-btn strong {
    display: block;
    color: white;
    margin-bottom: 5px;
}

.type-btn span {
    color: #7f8996;
    font-size: 12px;
}

.type-btn.selected {
    border-color: #3288e8;
    background: #152337;
}

.form-input,
.search-input,
.form-select {
    width: 100%;
    background: #171d25;
    border: 1px solid #303844;
    color: white;
    padding: 12px 13px;
    border-radius: 8px;
    outline: none;
}

.form-input:focus,
.search-input:focus,
.form-select:focus {
    border-color: #3288e8;
}

.setup-actions {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

/* =========================
   SEARCHABLE DROPDOWN
========================= */

.search-select {
    position: relative;
}

.search-results {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    background: #171d25;
    border: 1px solid #303844;
    border-radius: 8px;
    max-height: 250px;
    overflow-y: auto;
    z-index: 50;
    display: none;
}

.search-results.open {
    display: block;
}

.search-option {
    padding: 11px 13px;
    cursor: pointer;
    border-bottom: 1px solid #242b34;
    font-size: 13px;
}

.search-option:last-child {
    border-bottom: 0;
}

.search-option:hover {
    background: #222a34;
}

.search-option small {
    display: block;
    color: #737d89;
    margin-top: 3px;
}

.no-results {
    padding: 14px;
    color: #737d89;
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {
    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
        padding: 25px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #252c35;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .careers-grid {
        grid-template-columns: 1fr;
    }

    .type-buttons {
        grid-template-columns: 1fr;
    }

    .career-banner-row {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            Career Mode <span>Hub</span>
        </div>

        <div class="nav-title" id="careerNavTitle">
            Career
        </div>

        <button class="nav-btn active" data-page="dashboard" onclick="showPage('dashboard')">
            Dashboard
        </button>

        <div id="careerNavigation">

            <button class="nav-btn disabled" data-page="mycareer" onclick="showPage('mycareer')">
                My Career
            </button>

            <button class="nav-btn disabled" data-page="matches" onclick="showPage('matches')">
                Matches
            </button>

            <button class="nav-btn disabled" data-page="squad" onclick="showPage('squad')">
                Squad
            </button>

            <button class="nav-btn disabled" data-page="players" onclick="showPage('players')">
                Players
            </button>

            <button class="nav-btn disabled" data-page="youth" onclick="showPage('youth')">
                Youth Academy
            </button>

            <button class="nav-btn disabled" data-page="transfers" onclick="showPage('transfers')">
                Transfers
            </button>

            <button class="nav-btn disabled" data-page="competitions" onclick="showPage('competitions')">
                Competitions
            </button>

            <button class="nav-btn disabled" data-page="league" onclick="showPage('league')">
                League Centre
            </button>

            <button class="nav-btn disabled" data-page="past" onclick="showPage('past')">
                Past Seasons
            </button>

            <button class="nav-btn disabled" data-page="trophies" onclick="showPage('trophies')">
                Trophy Cabinet
            </button>

            <button class="nav-btn disabled" data-page="national" onclick="showPage('national')">
                National Team
            </button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div id="pageContent"></div>

    </main>

</div>


<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let allPlayers = [];

let fc27Leagues = [];
let fc27ClubsByLeague = {};

let careers = [];
let currentCareerId = null;

let setupClubType = "original";

let selectedLeague = "";
let selectedClub = "";
let selectedCountry = "";
let selectedContinent = "";


/* =========================================================
   COUNTRY DATA
========================================================= */

const countriesByContinent = {

    Europe: [
        "Albania","Andorra","Austria","Belarus","Belgium","Bosnia and Herzegovina",
        "Bulgaria","Croatia","Cyprus","Czech Republic","Denmark","England",
        "Estonia","Faroe Islands","Finland","France","Georgia","Germany",
        "Greece","Hungary","Iceland","Ireland","Israel","Italy","Kosovo",
        "Latvia","Liechtenstein","Lithuania","Luxembourg","Malta","Moldova",
        "Montenegro","Netherlands","North Macedonia","Northern Ireland","Norway",
        "Poland","Portugal","Republic of Ireland","Romania","Russia","San Marino",
        "Scotland","Serbia","Slovakia","Slovenia","Spain","Sweden","Switzerland",
        "Turkey","Ukraine","Wales"
    ],

    Asia: [
        "China PR","India","Indonesia","Iran","Iraq","Japan","Korea Republic",
        "Malaysia","Saudi Arabia","Thailand","United Arab Emirates"
    ],

    Africa: [
        "Algeria","Cameroon","Egypt","Ghana","Ivory Coast","Mali","Morocco",
        "Nigeria","Senegal","South Africa","Tunisia"
    ],

    NorthAmerica: [
        "Canada","Costa Rica","Honduras","Jamaica","Mexico","Panama",
        "United States"
    ],

    SouthAmerica: [
        "Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador",
        "Paraguay","Peru","Uruguay","Venezuela"
    ],

    Oceania: [
        "Australia","New Zealand"
    ]
};


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadCareers() {

    try {

        const saved = localStorage.getItem("careerModeHubCareers");

        if (saved) {
            careers = JSON.parse(saved);
        }

    } catch (error) {

        console.error("Could not load careers:", error);
        careers = [];

    }
}


function saveCareers() {

    localStorage.setItem(
        "careerModeHubCareers",
        JSON.stringify(careers)
    );
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

function showPage(page) {

    if (page !== "dashboard" && !currentCareerId) {
        showPage("dashboard");
        return;
    }

    document.querySelectorAll(".nav-btn").forEach(button => {

        button.classList.remove("active");

        if (button.dataset.page === page) {
            button.classList.add("active");
        }

    });


    if (page === "dashboard") {

        renderDashboard();
        return;

    }


    if (page === "mycareer") {

        renderCareerHome();
        return;

    }


    if (page === "matches") {

        renderPlaceholder(
            "Matches",
            "This is where your career mode matches will be tracked."
        );

        return;

    }


    if (page === "squad") {

        renderPlaceholder(
            "Squad",
            "Your current squad will appear here."
        );

        return;

    }


    if (page === "players") {

        renderPlayers();

        return;

    }


    if (page === "youth") {

        renderPlaceholder(
            "Youth Academy",
            "Youth academy players and development will appear here."
        );

        return;

    }


    if (page === "transfers") {

        renderPlaceholder(
            "Transfers",
            "Transfers, arrivals and departures will appear here."
        );

        return;

    }


    if (page === "competitions") {

        renderPlaceholder(
            "Competitions",
            "Your competitions and progress will appear here."
        );

        return;

    }


    if (page === "league") {

        renderPlaceholder(
            "League Centre",
            "League table, fixtures and promotion/relegation will appear here."
        );

        return;

    }


    if (page === "past") {

        renderPlaceholder(
            "Past Seasons",
            "Previous seasons will be stored here."
        );

        return;

    }


    if (page === "trophies") {

        renderPlaceholder(
            "Trophy Cabinet",
            "Your trophies and honours will appear here."
        );

        return;

    }


    if (page === "national") {

        renderPlaceholder(
            "National Team",
            "Your national team career will appear here."
        );

        return;

    }

}


/* =========================================================
   SIDEBAR STATE
========================================================= */

function updateNavigation() {

    const buttons = document.querySelectorAll(
        "#careerNavigation .nav-btn"
    );

    buttons.forEach(button => {

        if (currentCareerId) {

            button.classList.remove("disabled");

        } else {

            button.classList.add("disabled");

        }

    });

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

    currentCareerId = null;

    updateNavigation();

    document.getElementById("pageContent").innerHTML = `

        <div class="topbar">

            <div>

                <div class="page-title">
                    Dashboard
                </div>

                <div class="page-subtitle">
                    Choose a career mode or create a new one.
                </div>

            </div>

            <button class="primary-btn" onclick="startNewCareer()">
                + New Career
            </button>

        </div>


        <div class="careers-header">

            <div>
                <div class="panel-title">
                    Your Careers
                </div>

                <div class="panel-subtitle">
                    Run multiple career modes at the same time.
                </div>
            </div>

        </div>


        ${
            careers.length === 0

            ?

            `

            <div class="empty-state">

                <h2>No careers yet</h2>

                <p>
                    Create your first Career Mode save to get started.
                </p>

                <button
                    class="primary-btn"
                    onclick="startNewCareer()"
                >
                    Create Career
                </button>

            </div>

            `

            :

            `

            <div class="careers-grid">

                ${careers.map(career => createCareerCard(career)).join("")}

            </div>

            `
        }

    `;

}


function createCareerCard(career) {

    const nationalTeam = career.nationalTeam
        ? career.nationalTeam
        : "No National Team";

    return `

        <div class="career-card">

            <div class="career-card-top">

                <div>

                    <div class="career-name">
                        ${escapeHTML(career.managerName)}
                    </div>

                    <div class="career-club">
                        ${escapeHTML(career.clubName)}
                    </div>

                    <div class="career-league">
                        ${escapeHTML(career.league)}
                    </div>

                </div>

            </div>


            <div class="career-season">

                <span>
                    Current Year
                </span>

                <span class="season-value">
                    ${escapeHTML(career.currentSeason)}
                </span>

            </div>


            <div class="career-season">

                <span>
                    National Team
                </span>

                <span class="season-value">
                    ${escapeHTML(nationalTeam)}
                </span>

            </div>


            <div class="career-actions">

                <button
                    class="primary-btn"
                    onclick="enterCareer('${career.id}')"
                >
                    Enter Career
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteCareer('${career.id}', event)"
                >
                    Delete
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   NEW CAREER
========================================================= */

function startNewCareer() {

    setupClubType = "original";

    selectedLeague = "";
    selectedClub = "";
    selectedCountry = "";
    selectedContinent = "";

    renderCareerSetup();

}


/* =========================================================
   CAREER SETUP
========================================================= */

function renderCareerSetup() {

    currentCareerId = null;

    document.getElementById("pageContent").innerHTML = `

        <div class="topbar">

            <div>

                <div class="page-title">
                    Create Career
                </div>

                <div class="page-subtitle">
                    Set up your new Career Mode save.
                </div>

            </div>

        </div>


        <div class="setup-wrapper">

            <div class="setup-panel">


                <!-- MANAGER -->

                <div class="setup-section">

                    <label class="setup-label">
                        Manager Name
                    </label>

                    <input
                        id="managerName"
                        class="form-input"
                        placeholder="Enter manager name"
                    >

                </div>


                <!-- CLUB TYPE -->

                <div class="setup-section">

                    <label class="setup-label">
                        Club
                    </label>

                    <div class="type-buttons">

                        <button
                            id="originalClubButton"
                            class="type-btn selected"
                            onclick="selectClubType('original')"
                        >

                            <strong>
                                Original Club
                            </strong>

                            <span>
                                Manage an existing FC 27 club.
                            </span>

                        </button>


                        <button
                            id="createClubButton"
                            class="type-btn"
                            onclick="selectClubType('create')"
                        >

                            <strong>
                                Create a Club
                            </strong>

                            <span>
                                Create your own custom club.
                            </span>

                        </button>

                    </div>

                </div>


                <!-- LEAGUE -->

                <div class="setup-section">

                    <label class="setup-label">
                        League
                    </label>

                    <div class="search-select">

                        <input
                            id="leagueSearch"
                            class="search-input"
                            placeholder="Search FC 27 leagues..."
                            autocomplete="off"
                            oninput="searchLeague(this.value)"
                            onclick="openLeagueResults()"
                        >

                        <div
                            id="leagueResults"
                            class="search-results"
                        ></div>

                    </div>

                    <div class="setup-help">
                        Select a league from the FC 27 player database.
                    </div>

                </div>


                <!-- CLUB -->

                <div
                    id="clubSection"
                    class="setup-section"
                >

                    <label class="setup-label">
                        Club
                    </label>

                    <div class="search-select">

                        <input
                            id="clubSearch"
                            class="search-input"
                            placeholder="Select a league first..."
                            autocomplete="off"
                            oninput="searchClub(this.value)"
                            onclick="openClubResults()"
                            disabled
                        >

                        <div
                            id="clubResults"
                            class="search-results"
                        ></div>

                    </div>

                </div>


                <!-- CUSTOM CLUB -->

                <div
                    id="customClubSection"
                    class="setup-section"
                    style="display:none;"
                >

                    <label class="setup-label">
                        Custom Club Name
                    </label>

                    <input
                        id="customClubName"
                        class="form-input"
                        placeholder="Enter your club name"
                    >

                </div>


                <!-- SEASON -->

                <div class="setup-section">

                    <label class="setup-label">
                        Starting Season
                    </label>

                    <input
                        class="form-input"
                        value="2026/27"
                        disabled
                    >

                    <div class="setup-help">
                        Every new career starts in the 2026/27 season.
                    </div>

                </div>


                <!-- NATIONAL TEAM -->

                <div class="setup-section">

                    <label class="setup-label">
                        National Team
                    </label>

                    <select
                        id="nationalTeamChoice"
                        class="form-select"
                        onchange="toggleNationalTeam(this.value)"
                    >

                        <option value="none">
                            No National Team
                        </option>

                        <option value="add">
                            Add National Team
                        </option>

                    </select>

                </div>


                <!-- CONTINENT -->

                <div
                    id="continentSection"
                    class="setup-section"
                    style="display:none;"
                >

                    <label class="setup-label">
                        Continent
                    </label>

                    <select
                        id="continentSelect"
                        class="form-select"
                        onchange="selectContinent(this.value)"
                    >

                        <option value="">
                            Select continent
                        </option>

                        <option value="Europe">
                            Europe
                        </option>

                        <option value="Asia">
                            Asia
                        </option>

                        <option value="Africa">
                            Africa
                        </option>

                        <option value="NorthAmerica">
                            North America
                        </option>

                        <option value="SouthAmerica">
                            South America
                        </option>

                        <option value="Oceania">
                            Oceania
                        </option>

                    </select>

                </div>


                <!-- COUNTRY -->

                <div
                    id="countrySection"

/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let value = "";
    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];


        if (char === '"' && insideQuotes && next === '"') {

            value += '"';
            i++;
            continue;

        }


        if (char === '"') {

            insideQuotes = !insideQuotes;
            continue;

        }


        if (char === "," && !insideQuotes) {

            row.push(value);
            value = "";
            continue;

        }


        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(value);
            value = "";


            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }


            row = [];

            continue;

        }


        value += char;

    }


    if (value !== "" || row.length > 0) {

        row.push(value);

        if (row.some(cell => cell.trim() !== "")) {
            rows.push(row);
        }

    }


    if (rows.length === 0) {
        return [];
    }


    const headers =
        rows[0].map(header =>
            header.trim()
        );


    return rows
        .slice(1)
        .map(row => {

            const object = {};

            headers.forEach((header, index) => {

                object[header] =
                    row[index] !== undefined
                        ? row[index].trim()
                        : "";

            });

            return object;

        });

}


/* =========================================================
   PLAYER CONVERSION
========================================================= */

function getPlayerValue(row, possibleNames) {

    for (const name of possibleNames) {

        if (
            row[name] !== undefined &&
            row[name] !== ""
        ) {

            return row[name];

        }

    }

    return "";

}


function calculateAge(birthdate) {

    if (!birthdate) return "";

    const date =
        new Date(birthdate);

    if (isNaN(date.getTime())) {
        return "";
    }


    const now =
        new Date();


    let age =
        now.getFullYear() -
        date.getFullYear();


    const month =
        now.getMonth() -
        date.getMonth();


    if (
        month < 0 ||
        (
            month === 0 &&
            now.getDate() < date.getDate()
        )
    ) {

        age--;

    }


    return age;

}


function convertPlayer(row) {

    return {

        id:
            getPlayerValue(row, ["id"]),

        rank:
            getPlayerValue(row, ["rank"]),

        overallRating:
            getPlayerValue(row, [
                "overallRating",
                "overall",
                "rating"
            ]),

        firstName:
            getPlayerValue(row, [
                "firstName",
                "first_name"
            ]),

        lastName:
            getPlayerValue(row, [
                "lastName",
                "last_name"
            ]),

        commonName:
            getPlayerValue(row, [
                "commonName",
                "common_name"
            ]),

        birthdate:
            getPlayerValue(row, [
                "birthdate"
            ]),

        age:
            calculateAge(
                getPlayerValue(row, ["birthdate"])
            ),

        league:
            getPlayerValue(row, [
                "leagueName",
                "league"
            ]),

        club:
            getPlayerValue(row, [
                "team",
                "club"
            ]),

        nationality:
            getPlayerValue(row, [
                "nationality"
            ]),

        position:
            getPlayerValue(row, [
                "positionShort",
                "position"
            ]),

        preferredFoot:
            getPlayerValue(row, [
                "preferredFoot"
            ]),

        avatarUrl:
            getPlayerValue(row, [
                "avatarUrl"
            ]),

        shieldUrl:
            getPlayerValue(row, [
                "shieldUrl"
            ])

    };

}


/* =========================================================
   BUILD FC27 LEAGUE / CLUB DATABASE
========================================================= */

function buildFC27LeagueDatabase() {

    const leagueSet =
        new Set();


    const clubsByLeague = {};


    allPlayers.forEach(player => {

        const league =
            player.league;


        const club =
            player.club;


        if (!league) return;


        leagueSet.add(league);


        if (!clubsByLeague[league]) {

            clubsByLeague[league] = new Set();

        }


        if (club) {

            clubsByLeague[league].add(club);

        }

    });


    fc27Leagues =
        Array.from(leagueSet)
            .sort(
                (a, b) =>
                    a.localeCompare(b)
            );


    fc27ClubsByLeague = {};


    Object.keys(clubsByLeague).forEach(league => {

        fc27ClubsByLeague[league] =
            Array.from(
                clubsByLeague[league]
            ).sort(
                (a, b) =>
                    a.localeCompare(b)
            );

    });

}


/* =========================================================
   LOAD PLAYER DATABASE
========================================================= */

async function loadDatabase() {

    try {

        const response =
            await fetch(
                "data/players.csv?cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load players.csv"
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        allPlayers =
            rows.map(convertPlayer);


        buildFC27LeagueDatabase();


        console.log(
            "Loaded players:",
            allPlayers.length
        );


        console.log(
            "FC27 leagues:",
            fc27Leagues.length
        );


    } catch (error) {

        console.error(
            "Player database error:",
            error
        );

    }

}


/* =========================================================

========================================================= */

/*
   This function will be used later when the user
   finishes a season.

   Example:

   updateCareerLeague(
       career.id,
       "EFL Championship",
       "2027/28"
   );

   This changes the current league AND current year
   while keeping the previous league in history.
*/

function updateCareerLeague(
    careerId,
    newLeague,
    newSeason
) {

    const career =
        careers.find(
            c => c.id === careerId
        );


    if (!career) return;


    career.leagueHistory.push({

        season: newSeason,

        league: newLeague

    });


    career.league =
        newLeague;


    career.currentSeason =
        newSeason;


    career.seasonNumber =
        (career.seasonNumber || 1) + 1;


    saveCareers();


    if (currentCareerId === careerId) {

        renderCareerHome();

    }

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJS(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

}
