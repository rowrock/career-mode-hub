function filterPlayerTrophyCabinet(){
 const c=getCurrentCareer();if(!c)return;
 const mode=document.getElementById("trophyCabinetFilter")?.value||"all";
 const q=(document.getElementById("trophyCabinetSearch")?.value||"").toLowerCase().trim();
 const selected=(c.trophies||[]).filter(t=>{
  const team=String(t.type||"").toLowerCase()==="team trophy";
  if(mode==="team"&&!team)return false;if(mode==="individual"&&team)return false;
  return [t.award,t.competition,t.team,t.season,t.date].some(v=>String(v||"").toLowerCase().includes(q));
 });
 const box=document.getElementById("playerTrophyCabinetList");if(!box)return;
 box.innerHTML=playerTrophyTable({...c,trophies:selected});
}

function deletePlayerTrophy(id){
  const c=getCurrentCareer();if(!c)return;
  if(!confirm("Delete this award or trophy?"))return;
  c.trophies=c.trophies.filter(t=>String(t.id)!==String(id));
  saveCareers();renderPlayerCareerPage("trophies");
}

function playerSeasonStatsTable(c){
  const seasons=(c.seasons||[]).slice();
  if(!seasons.some(s=>s.season===c.currentSeason))seasons.push({season:c.currentSeason,clubName:c.clubName,league:c.league,current:true});
  if(!seasons.length)return '<p style="color:#8d97a3">Season summaries will appear here.</p>';
  let html='<div style="overflow-x:auto"><table class="data-table" style="width:100%;border-collapse:collapse"><thead><tr><th>Season</th><th>Club</th><th>League</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Avg Rating</th><th>Status</th></tr></thead><tbody>';
  seasons.slice().sort((a,b)=>String(b.season).localeCompare(String(a.season))).forEach(function(season){
    const st=playerCareerStats(c,season.season);
    html+='<tr><td>'+escapeHTML(season.season||"—")+'</td><td>'+escapeHTML(season.clubName||c.clubName||"—")+'</td><td>'+escapeHTML(season.league||c.league||"—")+'</td><td>'+st.appearances+'</td><td>'+st.goals+'</td><td>'+st.assists+'</td><td>'+st.average+'</td><td>'+(season.completed?"Completed":"In progress")+'</td></tr>';
  });
  return html+'</tbody></table></div>';
}

function finishPlayerSeason(){
  const c=getCurrentCareer();if(!c||c.mode!=="player")return;
  const old=c.currentSeason||"2026/27";
  const st=playerCareerStats(c,old);
  const found=c.seasons.find(s=>s.season===old);
  if(found){found.completed=true;found.clubName=c.clubName;found.league=c.league;found.summary={appearances:st.appearances,goals:st.goals,assists:st.assists,averageRating:st.average};}
  else c.seasons.push({season:old,clubName:c.clubName,league:c.league,completed:true,summary:{appearances:st.appearances,goals:st.goals,assists:st.assists,averageRating:st.average}});
  const match=String(old).match(/^(\d{4})\s*\/\s*(\d{2}|\d{4})$/);
  if(!match){const next=prompt("Current season saved. Enter the next season label:",old);if(next===null)return;c.currentSeason=next.trim()||old;}
  else{const start=Number(match[1])+1;c.currentSeason=String(start)+"/"+String(start+1).slice(-2);}
  c.seasonNumber=(Number(c.seasonNumber)||1)+1;
  if(!c.seasons.some(s=>s.season===c.currentSeason))c.seasons.push({season:c.currentSeason,clubName:c.clubName,league:c.league,completed:false});
  saveCareers();renderPlayerCareerPage("past");
}



/* PLAYER CAREER SCREENSHOT AI — reuses the existing secure Worker and OpenRouter connection */
async function analysePlayerCalendarFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  const c=getCurrentCareer();if(!c||c.mode!=="player")return;
  try{
    const data=await analyseCareerScreenshots("calendar",files);
    const events=Array.isArray(data.events)?data.events:[];
    if(!events.length){alert("The AI couldn't confidently read any fixtures. Try a clearer screenshot.");return;}
    const preview=events.slice(0,12).map((e,i)=>(i+1)+". "+(e.date||"Date unclear")+" — "+(e.opponent||"Opponent unclear")+" ("+(e.competition||"Competition unclear")+")").join("\n");
    if(!confirm("Review the detected fixtures carefully. Nothing is saved until you confirm.\n\n"+preview+"\n\nImport "+events.length+" fixture(s)?"))return;
    let added=0,skipped=0;
    if(!Array.isArray(c.calendar))c.calendar=[];
    const keys=new Set(c.calendar.map(e=>[e.date,e.opponent,e.competition].map(x=>String(x||"").toLowerCase()).join("|")));
    for(const e of events){
      let date=typeof e.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)?e.date:"";
      let opponent=String(e.opponent||"").trim();
      if(!opponent){skipped++;continue;}
      if(!date){
        const entered=prompt("Enter the date for fixture against "+opponent+" (YYYY-MM-DD), or leave blank to skip:");
        if(!entered){skipped++;continue;}
        if(!/^\d{4}-\d{2}-\d{2}$/.test(entered)){alert("Invalid date for "+opponent+". That fixture was skipped.");skipped++;continue;}
        date=entered;
      }
      const competition=String(e.competition||"").trim();
      const key=[date,opponent,competition].map(x=>String(x||"").toLowerCase()).join("|");
      if(keys.has(key)){skipped++;continue;}
      keys.add(key);
      c.calendar.push({id:createId(),date,opponent,competition,homeAway:e.homeAway||"",notes:"Imported from screenshot; please verify details.",season:c.currentSeason,source:"ai"});
      added++;
    }
    saveCareers();renderPlayerCareerPage("calendar");
    alert("Imported "+added+" fixture(s)."+(skipped?" "+skipped+" fixture(s) were skipped or were duplicates.":"")+" Please check the calendar for accuracy.");
  }catch(error){
    alert("Player calendar AI failed: "+(error.message||"Please try again."));
  }
}

async function analysePlayerMatchFiles(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  const c=getCurrentCareer();if(!c||c.mode!=="player")return;
  try{
    const data=await analyseCareerScreenshots("match",files);
    const p=c.player||{};
    const norm=v=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    const playerNames=[p.name].map(norm);
    const extracted=Array.isArray(data.players)?data.players:[];
    const found=extracted.find(x=>playerNames.includes(norm(x.name||x.playerName||x.player||x.commonName)));
    const home=String(data.homeTeam||"").trim(),away=String(data.awayTeam||"").trim();
    const club=String(c.clubName||"").trim();
    let opponent="",goalsFor=null,goalsAgainst=null,venue="Home";
    const hs=data.homeScore??data.homeGoals,as=data.awayScore??data.awayGoals;
    if(home&&norm(home)===norm(club)){opponent=away;venue="Home";goalsFor=hs;goalsAgainst=as;}
    else if(away&&norm(away)===norm(club)){opponent=home;venue="Away";goalsFor=as;goalsAgainst=hs;}
    else{opponent=String(data.opponent||away||home||"").trim();goalsFor=data.goalsFor??null;goalsAgainst=data.goalsAgainst??null;}
    if(!opponent)opponent=prompt("The AI couldn't identify the opposition. Enter the opponent:","")||"";
    if(!opponent){alert("No opponent was identified. Nothing was saved.");return;}
    const date=prompt("Enter the match date (YYYY-MM-DD). The date must be entered manually:","");
    if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert("A valid match date is required. Nothing was saved.");return;}
    const competition=String(data.competition||"").trim()||prompt("Competition (e.g. League / Cup):","")||"";
    if(goalsFor==null||goalsAgainst==null){
      const score=prompt("Confirm the final score from your team's perspective (your goals-opponent goals):","");
      const m=String(score||"").match(/^\s*(\d+)\s*[-–:]\s*(\d+)\s*$/);
      if(!m){alert("A valid final score is required. Nothing was saved.");return;}
      goalsFor=Number(m[1]);goalsAgainst=Number(m[2]);
    }
    const rating=found?(found.rating??found.playerRating??null):null;
    const goals=found?Number(found.goals??found.goalsScored??0):0;
    const assists=found?Number(found.assists??found.assistsMade??0):0;
    const minutes=found?Number(found.minutes??found.minutesPlayed??90):90;
    const yellowCards=found?Number(found.yellowCards??found.yellow??0):0;
    const redCards=found?Number(found.redCards??found.red??0):0;
    const cleanSheet=String(p.position||"").toUpperCase()==="GK"&&Number(goalsAgainst)===0;
    const summary="Player: "+p.name+"\nClub: "+club+"\nOpponent: "+opponent+"\nCompetition: "+(competition||"Not detected")+"\nScore: "+goalsFor+"–"+goalsAgainst+" ("+venue+")\nRating: "+(rating==null?"Not detected":rating)+"\nGoals: "+goals+"\nAssists: "+assists+"\nMinutes: "+minutes+"\nYellow / red cards: "+yellowCards+" / "+redCards+"\n\nPlease verify the screenshot extraction. Save this match?";
    if(!confirm(summary)){alert("Cancelled. Nothing was saved.");return;}
    c.matches.push({
      id:createId(),mode:"player",date,opponent,competition,homeAway:venue,
      goalsFor:Number(goalsFor),goalsAgainst:Number(goalsAgainst),
      result:Number(goalsFor)>Number(goalsAgainst)?"W":Number(goalsFor)<Number(goalsAgainst)?"L":"D",
      rating:rating==null||rating===""?null:Number(rating),minutes,goals,assists,yellowCards,redCards,
      position:p.position,cleanSheet,season:c.currentSeason,clubName:club,international:false,
      entryMethod:"ai",screenshots:files.map(f=>f.name)
    });
    saveCareers();renderPlayerCareerPage("matches");
    alert("Match saved. Please double-check the imported statistics against the screenshot.");
  }catch(error){
    alert("Player match AI failed: "+(error.message||"Please try again."));
  }
}
