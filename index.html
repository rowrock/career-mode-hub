<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Mode Hub</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0f14;
    color:#f5f7fa;
}

button,input,select{font-family:inherit}
button{cursor:pointer}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:235px;
    background:#11161d;
    border-right:1px solid #252c35;
    padding:24px 14px;
    z-index:20;
    overflow-y:auto;
}

.logo{
    font-size:22px;
    font-weight:800;
    padding:8px 12px 25px;
}

.logo span{color:#4da3ff}
.account-panel{margin:0 4px 22px;padding:12px;background:#171d25;border:1px solid #303844;border-radius:10px}
.account-status{font-size:12px;color:#9ca5b1;line-height:1.5;margin-bottom:9px;overflow-wrap:anywhere}
.account-btn{width:100%;padding:9px 10px;border-radius:7px;border:1px solid #3a4654;background:#243140;color:#fff;font-weight:700;margin-top:5px}
.account-btn.secondary{background:transparent;color:#cbd5e1}
.auth-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:18px}
.auth-card{width:min(440px,100%);background:#11161d;border:1px solid #303844;border-radius:14px;padding:24px;box-shadow:0 20px 70px #0009}
.auth-card h2{margin:0 0 7px;font-size:23px}.auth-muted{color:#8d97a3;font-size:13px;line-height:1.5;margin-bottom:18px}
.auth-field{display:block;margin:13px 0 6px;font-size:13px;font-weight:700}
.auth-input{width:100%;padding:12px;border-radius:8px;border:1px solid #303844;background:#0b0f14;color:#fff;font-size:14px}
.auth-actions{display:flex;gap:8px;margin-top:18px}.auth-actions button{flex:1}
.auth-error{color:#ff9a9a;font-size:13px;margin-top:12px;line-height:1.5}
.auth-link{background:none;border:0;color:#78b8ff;padding:12px 0 0;text-decoration:underline;font-size:13px}
@media(max-width:700px){.sidebar{width:190px;padding:16px 9px}.main{margin-left:190px;padding:20px 14px}.logo{font-size:18px;padding-left:7px}.account-panel{padding:9px 7px}}

.nav-title{
    color:#707986;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    padding:0 12px 8px;
    letter-spacing:1px;
}

.nav-btn{
    width:100%;
    background:transparent;
    border:0;
    color:#9ca5b1;
    text-align:left;
    padding:11px 12px;
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
}

.nav-btn:hover{
    background:#1a2028;
    color:white;
}

.nav-btn.active{
    background:#1d2835;
    color:white;
    font-weight:700;
}

.nav-btn.disabled{
    opacity:.5;
}

.main{
    margin-left:235px;
    min-height:100vh;
    padding:32px 38px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:28px;
}

.page-title{
    font-size:28px;
    font-weight:800;
}

.page-subtitle{
    color:#7f8996;
    margin-top:5px;
    font-size:14px;
}

.primary-btn{
    background:#3288e8;
    color:white;
    border:0;
    padding:11px 17px;
    border-radius:8px;
    font-weight:700;
    font-size:14px;
}

.primary-btn:hover{background:#2576d0}

.secondary-btn{
    background:#1a2028;
    color:#e7ebf0;
    border:1px solid #303844;
    padding:10px 15px;
    border-radius:8px;
    font-weight:600;
}

.secondary-btn:hover{background:#222a34}

.delete-btn{
    background:transparent;
    border:1px solid #493038;
    color:#d97886;
    padding:9px 13px;
    border-radius:7px;
}

.panel{
    background:#11161d;
    border:1px solid #252c35;
    border-radius:12px;
    padding:22px;
}

.panel-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:5px;
}

.panel-subtitle{
    color:#7f8996;
    font-size:13px;
    margin-bottom:20px;
}

.careers-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
}

.career-card{
    background:#11161d;
    border:1px solid #252c35;
    border-radius:12px;
    padding:20px;
}

.career-card:hover{
    border-color:#3b4653;
}

.career-name{
    font-size:19px;
    font-weight:800;
}

.career-club{
    color:#d8dde4;
    margin-top:5px;
}

.career-league{
    color:#7f8996;
    font-size:13px;
    margin-top:3px;
}

.career-season{
    margin-top:15px;
    padding-top:13px;
    border-top:1px solid #252c35;
    display:flex;
    justify-content:space-between;
    color:#8d97a3;
    font-size:13px;
}

.season-value{
    color:white;
    font-weight:700;
}

.career-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.career-actions .primary-btn{flex:1}

.empty-state{
    background:#11161d;
    border:1px dashed #303844;
    border-radius:12px;
    padding:50px 20px;
    text-align:center;
    color:#7f8996;
}

.empty-state h2{
    color:white;
    margin-top:0;
}

.career-banner{
    background:#11161d;
    border:1px solid #252c35;
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:24px;
}

.career-banner-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.current-career-label{
    color:#737d89;
    font-size:11px;
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:1px;
}

.current-career-name{
    font-size:22px;
    font-weight:800;
    margin-top:4px;
}

.current-career-info{
    color:#8d97a3;
    font-size:13px;
    margin-top:5px;
}

.back-dashboard{
    background:#1a2028;
    border:1px solid #303844;
    color:white;
    padding:9px 13px;
    border-radius:7px;
}

.match-summary-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:22px;
}

.match-stat{
    background:#171d25;
    border:1px solid #252c35;
    border-radius:9px;
    padding:15px;
}

.match-stat-label{
    color:#7f8996;
    font-size:11px;
    text-transform:uppercase;
}

.match-stat-number{
    font-size:23px;
    font-weight:800;
    margin-top:6px;
}

.setup-wrapper{max-width:850px}

.setup-panel{
    background:#11161d;
    border:1px solid #252c35;
    border-radius:12px;
    padding:28px;
}

.setup-section{margin-bottom:26px}

.setup-label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
}

.type-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.type-btn{
    background:#171d25;
    border:1px solid #303844;
    color:#cdd3db;
    border-radius:9px;
    padding:17px;
    text-align:left;
}

.type-btn strong{
    display:block;
    color:white;
    margin-bottom:5px;
}

.type-btn span{
    color:#7f8996;
    font-size:12px;
}

.type-btn.selected{
    border-color:#3288e8;
    background:#152337;
}

.form-input,.search-input,.form-select{
    width:100%;
    background:#171d25;
    border:1px solid #303844;
    color:white;
    padding:12px 13px;
    border-radius:8px;
    outline:0;
}

.form-input:focus,
.search-input:focus,
.form-select:focus{
    border-color:#3288e8;
}

.search-select{position:relative}

.search-results{
    position:absolute;
    left:0;
    right:0;
    top:calc(100% + 4px);
    background:#171d25;
    border:1px solid #303844;
    border-radius:8px;
    max-height:260px;
    overflow-y:auto;
    z-index:100;
    display:none;
}

.search-results.open{display:block}

.search-option{
    padding:11px 13px;
    cursor:pointer;
    border-bottom:1px solid #242b34;
    font-size:13px;
}

.search-option:hover{
    background:#222a34;
}

.match-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.match-row{
    background:#171d25;
    border:1px solid #252c35;
    border-radius:9px;
    padding:16px;
}

.match-row-main{
    display:grid;
    grid-template-columns:90px 1fr 100px 90px;
    align-items:center;
    gap:15px;
}

.match-date{
    color:#7f8996;
    font-size:12px;
}

.match-competition{
    color:#7f8996;
    font-size:11px;
    margin-top:4px;
}

.match-opponent{
    font-weight:800;
    font-size:15px;
}

.match-home-away{
    color:#8d97a3;
    font-size:12px;
    margin-top:4px;
}

.match-score{
    text-align:center;
    font-size:21px;
    font-weight:800;
}

.match-result{
    text-align:center;
    font-weight:800;
}

.result-win{color:#69d38b}
.result-draw{color:#e0bd68}
.result-loss{color:#e27684}

.match-details{
    border-top:1px solid #252c35;
    margin-top:14px;
    padding-top:12px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    align-items:center;
    color:#8d97a3;
    font-size:12px;
}

.entry-choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.entry-choice{
    background:#171d25;
    border:1px solid #303844;
    border-radius:11px;
    padding:25px;
    text-align:left;
    color:white;
}

.entry-choice:hover{
    border-color:#3288e8;
    background:#152337;
}

.entry-icon{
    font-size:30px;
    margin-bottom:13px;
}

.entry-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:7px;
}

.entry-description{
    color:#7f8996;
    font-size:13px;
    line-height:1.5;
}

.player-entry-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:15px;
    overflow-x:auto;
}
.player-entry{min-width:760px}
.player-entry-header{min-width:760px}

.player-entry{
    background:#171d25;
    border:1px solid #252c35;
    border-radius:9px;
    padding:13px;
    display:grid;
    grid-template-columns:1fr 90px 75px 75px 80px 35px;
    gap:8px;
    align-items:center;
}

.player-entry-header{
    color:#737d89;
    font-size:10px;
    text-transform:uppercase;
    padding:0 13px;
}

.remove-player{
    background:transparent;
    border:0;
    color:#d97886;
    font-size:20px;
}

.upload-area{
    border:2px dashed #34404d;
    border-radius:12px;
    padding:45px 25px;
    text-align:center;
    background:#151b22;
}

.upload-icon{
    font-size:38px;
    margin-bottom:12px;
}

.upload-title{
    font-size:18px;
    font-weight:800;
}

.upload-description{
    color:#7f8996;
    font-size:13px;
    margin:8px auto 20px;
    max-width:500px;
    line-height:1.6;
}

.file-list{
    margin-top:18px;
}

.file-item{
    background:#1b222b;
    border:1px solid #2b3440;
    border-radius:7px;
    padding:10px 12px;
    margin-bottom:7px;
    font-size:12px;
    color:#b9c1ca;
}

.review-box{
    background:#151b22;
    border:1px solid #303844;
    border-radius:10px;
    padding:18px;
    margin-top:15px;
}

.review-warning{
    background:#282319;
    border:1px solid #594a2b;
    color:#d8c47e;
    border-radius:8px;
    padding:13px;
    font-size:12px;
    margin-bottom:15px;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
}

.modal{
    width:100%;
    max-width:950px;
    max-height:92vh;
    overflow-y:auto;
    background:#11161d;
    border:1px solid #303844;
    border-radius:13px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.modal-title{
    font-size:21px;
    font-weight:800;
}

.close-btn{
    background:#171d25;
    border:1px solid #303844;
    color:#cdd3db;
    font-size:20px;
    width:36px;
    height:36px;
    border-radius:7px;
}

.close-btn:hover{
    background:#252c35;
    color:white;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{margin-bottom:17px}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#cdd3db;
    margin-bottom:7px;
}

.score-inputs{
    display:grid;
    grid-template-columns:1fr 45px 1fr;
    gap:10px;
    align-items:center;
}

.score-inputs span{
    text-align:center;
    color:#7f8996;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.player-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:12px;
    margin-top:18px;
}

.player-card{
    background:#171d25;
    border:1px solid #252c35;
    border-radius:10px;
    padding:15px;
}

.player-name{
    font-weight:800;
    font-size:16px;
}

.player-club{
    color:#7f8996;
    font-size:13px;
    margin-top:5px;
}

/* CALENDAR */

.calendar-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.calendar-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.calendar-match{
    position:relative;
    border:1px solid #303844;
    border-radius:11px;
    padding:17px;
    cursor:pointer;
    overflow:hidden;
    transition:.15s;
}

.calendar-match:hover{
    transform:translateY(-1px);
    border-color:#5b6775;
}

.calendar-match.favorite{
    border-color:#e0bd68;
}

.calendar-match.favorite:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#e0bd68;
}

.calendar-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.calendar-date{
    font-size:12px;
    color:#cbd2da;
    min-width:90px;
}

.calendar-competition{
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.calendar-opponent{
    margin-top:8px;
    font-size:17px;
    font-weight:800;
}

.calendar-meta{
    color:#8993a0;
    font-size:12px;
    margin-top:5px;
}

.favorite-btn{
    margin-left:auto;
    background:transparent;
    border:0;
    font-size:20px;
    color:#68727e;
}

.favorite-btn.active{
    color:#e0bd68;
}

.calendar-empty{
    text-align:center;
    padding:50px 20px;
    color:#7f8996;
}

/* COMPETITION THEMES */

.theme-premier{
    background:
        linear-gradient(135deg,rgba(25,60,110,.75),rgba(12,17,25,.95));
}

.theme-fa{
    background:
        linear-gradient(135deg,rgba(35,65,110,.75),rgba(12,17,25,.95));
}

.theme-carabao{
    background:
        linear-gradient(135deg,rgba(70,70,80,.75),rgba(12,17,25,.95));
}

.theme-champions{
    background:
        linear-gradient(135deg,rgba(32,35,95,.8),rgba(12,17,25,.95));
}

.theme-europa{
    background:
        linear-gradient(135deg,rgba(100,55,25,.8),rgba(12,17,25,.95));
}

.theme-conference{
    background:
        linear-gradient(135deg,rgba(30,90,65,.8),rgba(12,17,25,.95));
}

.theme-la-liga{
    background:
        linear-gradient(135deg,rgba(115,45,35,.8),rgba(12,17,25,.95));
}

.theme-bundesliga{
    background:
        linear-gradient(135deg,rgba(110,35,35,.8),rgba(12,17,25,.95));
}

.theme-seriea{
    background:
        linear-gradient(135deg,rgba(35,80,110,.8),rgba(12,17,25,.95));
}

.theme-ligue1{
    background:
        linear-gradient(135deg,rgba(45,45,85,.8),rgba(12,17,25,.95));
}

.theme-friendly{
    background:
        linear-gradient(135deg,rgba(60,70,60,.75),rgba(12,17,25,.95));
}

.theme-international{
    background:
        linear-gradient(135deg,rgba(25,90,75,.8),rgba(12,17,25,.95));
}

.theme-worldcup{
    background:
        linear-gradient(135deg,rgba(85,45,90,.85),rgba(12,17,25,.95));
}

.team-selector{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.selected-team{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    background:#171d25;
    border:1px solid #303844;
    border-radius:8px;
}

.selected-team button{
    background:transparent;
    border:0;
    color:#d97886;
    font-size:18px;
}

.season-team-search{
    margin-top:10px;
}

.info-box{
    background:#151b22;
    border:1px solid #303844;
    border-radius:9px;
    padding:14px;
    color:#8d97a3;
    font-size:12px;
    line-height:1.6;
}

@media(max-width:1000px){
    .match-summary-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .sidebar{
        position:static;
        width:100%;
        height:auto;
        border-right:0;
        border-bottom:1px solid #252c35;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .match-row-main{
        grid-template-columns:1fr 1fr;
    }

    .entry-choice-grid,
    .type-buttons,
    .team-selector{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .match-summary-grid{
        grid-template-columns:1fr 1fr;
    }

    .player-entry{
        grid-template-columns:1fr 75px 65px;
    }
}

            careers=JSON.parse(saved);
        }

        careers.forEach(c=>{

            if(!Array.isArray(c.matches))
                c.matches=[];

            if(!Array.isArray(c.squad))
                c.squad=[];

            if(!Array.isArray(c.transfers))
                c.transfers=[];

            if(!Array.isArray(c.trophies))
                c.trophies=[];

            if(!Array.isArray(c.calendar))
                c.calendar=[];

            if(!Array.isArray(c.seasons))
                c.seasons=[];
            c.seasons.forEach(season=>{if(!Array.isArray(season.leagueResults))season.leagueResults=[];});

            if(!c.currentSeason)
                c.currentSeason="2026/27";

            if(!c.seasonNumber)
                c.seasonNumber=1;

            // Older saves may not have a season stamped on each match.
            // Assign legacy records to the current season so they are not
            // incorrectly counted in every past season.
            c.matches.forEach(m=>{
                if(m && !m.season) m.season=c.currentSeason;
            });

        });

    }catch(e){

        careers=[];

    }
}


function saveCareers(){

    localStorage.setItem(
        "careerModeHubCareers",
        JSON.stringify(careers)
    );
    scheduleCloudSave();
}


function getCurrentCareer(){

    return careers.find(
        c=>c.id===currentCareerId

}

function showPage(page){

    document.body.dataset.page=page||"dashboard";

    if(page!=="dashboard" && !currentCareerId){

        renderDashboard();
        return;

    }

    document.querySelectorAll(".nav-btn").forEach(btn=>{

        btn.classList.remove("active");

        if(btn.dataset.page===page)
            btn.classList.add("active");

    });

    if(page==="dashboard")
        renderDashboard();

    else if(getCurrentCareer() && getCurrentCareer().mode==="player")
        renderPlayerCareerPage(page);

    else if(page==="mycareer")
        renderCareerHome();

    else if(page==="calendar")
        renderCalendar();

    else if(page==="matches")
        renderMatches();
    else if(page==="squad")
        renderSquadHub();
    else if(page==="transfers")
        renderTransfers();

    else if(page==="players")
        renderPlayers();
    else if(page==="league")
        renderLeagueCentre();
    else if(page==="trophies")
        renderTrophyCabinet();
    else if(page==="competitions")
        renderCompetitionsHub();
    else if(page==="past")
        renderPastSeasons();
    else if(page==="youth")
        renderYouthAcademy();
    else if(page==="national")
        renderNationalTeamHub();
    else
        renderPlaceholder(pageTitle(page),"This section will be built next.");
}

        past:"Past Seasons",
        trophies:"Trophy Cabinet",

function getFormationSlots(f){
 let slots=[{id:"GK",role:"GK",x:50,y:91}],d=4,rows=[];
 if(f.indexOf("3-")===0)d=3;else if(f.indexOf("5-")===0)d=5;
 function add(n,y,role,prefix){rows.push({n:n,y:y,role:role,prefix:prefix});}
 if(f.indexOf("4-2-3-1")===0){add(2,62,"CDM","M");add(3,44,"CAM/W","F");add(1,24,"ST","S");}
 else if(f.indexOf("4-3-3")===0){add(3,56,"MID","M");add(3,25,"FWD","F");}

 else if(f==="4-1-4-1"){add(1,64,"CDM","M");add(4,50,"MID","N");add(1,24,"ST","S");}
 else if(f==="4-5-1"){add(5,54,"MID","M");add(1,24,"ST","S");}
 else if(f==="3-4-2-1"){add(4,57,"MID","M");add(2,40,"AM","F");add(1,23,"ST","S");}
 else if(f.indexOf("3-4-3")===0){add(4,57,"MID","M");add(3,24,"FWD","F");}
 else if(f==="3-5-2"){add(5,54,"MID","M");add(2,24,"ST","S");}
 else if(f==="5-2-1-2"){add(2,60,"CM","M");add(1,43,"CAM","C");add(2,24,"ST","S");}

 else if(f==="5-2-3"){add(2,59,"CM","M");add(3,24,"FWD","F");}
 else {add(3,56,"MID","M");add(3,25,"FWD","F");}
 for(let i=0;i<d;i++)slots.push({id:"D"+(i+1),role:"DEF",x:d===1?50:12+76*i/(d-1),y:75});
 rows.forEach(r=>{for(let i=0;i<r.n;i++)slots.push({id:r.prefix+(i+1),role:r.role,x:r.n===1?50:12+76*i/(r.n-1),y:r.y});});
 return slots;
}

function getPlayerSeasonStats(c,p){
 const id=String(squadPlayerId(p)),name=String(squadPlayerName(p)).toLowerCase(),matches=(c.matches||[]).filter(m=>String(m.season||c.currentSeason)===String(c.currentSeason));

 matches.forEach(m=>(m.players||[]).forEach(x=>{let xid=String(x.playerId??x.id??""),xn=String(x.name||x.playerName||"").toLowerCase();if((id&&xid===id)||xn===name){apps++;goals+=Number(x.goals)||0;assists+=Number(x.assists)||0;if(x.rating!==null&&x.rating!==undefined&&x.rating!==""){rs+=Number(x.rating)||0;rc++;}yellow+=Number(x.yellowCards)||0;red+=Number(x.redCards)||0;minutes+=Number(x.minutes)||0;saves+=Number(x.saves)||0;}}));
 return {apps,goals,assists,avgRating:rc?(rs/rc).toFixed(1):"—",yellow,red,minutes,saves};
}

========================================================= */

function createCareer(){

    const manager=document.getElementById("managerName").value.trim();

    if(!manager){
        alert("Please enter a manager name.");
        return;
    }

    if(!selectedLeague){
        alert("Please select a league.");
        return;
    }

    let club="";

    if(setupClubType==="original"){

        if(!selectedClub){
            alert("Please select a club.");
            return;
        }

        club=selectedClub;

    }else{

        club=document.getElementById("customClubName").value.trim();

        if(!club){
            alert("Please enter your custom club name.");
            return;
        }
    }

    const nationalChoice=
        document.getElementById("nationalTeamChoice").value;

    if(nationalChoice==="add"&&!selectedCountry){
        alert("Please select a national team.");
        return;
    }

    const career={

        id:createId(),

        managerName:manager,

        clubType:setupClubType,

        clubName:club,

        league:selectedLeague,

        currentSeason:"2026/27",

        seasonNumber:1,

        nationalTeam:
            nationalChoice==="add"
            ?selectedCountry
            :null,

        continent:
            nationalChoice==="add"
            ?selectedContinent
            :null,

        matches:[],
        calendar:[],
        transfers:[],
        trophies:[],
        squad:[],
        youthAcademy:[],
        nationalSquad:[],
        internationalMatches:[],

        seasons:[{

            season:"2026/27",

            league:selectedLeague,

            leagueTeams:[],

            competitions:[],

            calendarUploaded:false

        }]

    };

    careers.push(career);

    saveCareers();

    enterCareer(career.id);

    /*
     * Immediately ask which teams are in the league.
     */

    setTimeout(
        ()=>openSeasonSetup(true),
        100
    );
}

 if((c.seasons||[]).some(s=>s.season===next)){alert("The next season already exists in this career.");return;}
 const stats=getSeasonStatistics(c,current);
 if(!confirm("Finish "+current+" and start "+next+"?\n\nYour "+stats.played+" recorded matches and season history will be kept. The new season starts with your main league; join other competitions in the Competitions tab."))return;
 const old=getSeason(c);if(old){old.completed=true;old.completedAt=todayDate();old.finalSummary={played:stats.played,wins:stats.wins,draws:stats.draws,losses:stats.losses,goalsFor:stats.goalsFor,goalsAgainst:stats.goalsAgainst,points:stats.points};}

function getSeason(career){

    if(!career)return null;

    if(!Array.isArray(career.seasons))
        career.seasons=[];

    let season=career.seasons.find(
        x=>x.season===career.currentSeason
    );

    if(!season){

        season={
            season:career.currentSeason,
            league:career.league,
            leagueTeams:[],
            competitions:[],
            calendarUploaded:false
        };

        career.seasons.push(season);
    }

    if(!Array.isArray(season.leagueTeams))
        season.leagueTeams=[];

    if(!Array.isArray(season.competitions))
        season.competitions=[];
    if(!Array.isArray(season.leagueResults))
        season.leagueResults=[];

    return season;
}

function getCompetitionTeams(competition){

    const career=getCurrentCareer();

    if(!career)return[];

    const season=getSeason(career);

    if(
        competition==="Premier League"
        ||
        competition===career.league
    ){

        return season.leagueTeams||[];
    }

    /*
     * English domestic cups:
     * use the full FC27 database of English clubs.
     */

    if(
        competition==="FA Cup"
        ||
        competition==="Carabao Cup"
    ){

        return getEnglishClubs();
    }

    /*
     * International competitions.
     */

    if(
        competition==="International Friendly"
        ||
        competition==="UEFA Nations League"
        ||
        competition==="World Cup"
        ||
        competition==="European Championship"
    ){

        return countriesByContinent.Europe
            .concat(
                countriesByContinent.SouthAmerica,
                countriesByContinent.NorthAmerica,
                countriesByContinent.Africa,
                countriesByContinent.Asia,
                countriesByContinent.Oceania
            )
            .filter(
                (x,i,a)=>a.indexOf(x)===i
            );
    }

    /*
     * European competitions:
     * use all clubs from the database.
     */

    if(
        competition==="UEFA Champions League"
        ||
        competition==="UEFA Europa League"
        ||
        competition==="UEFA Conference League"
    ){

        return getAllClubs();
    }

    /*
     * Major domestic leagues.
     */

    if(
        [
            "La Liga",
            "Bundesliga",
            "Serie A",
            "Ligue 1"
        ].includes(competition)
    ){

        const possibleLeague={
            "La Liga":"La Liga",
            "Bundesliga":"Bundesliga",
            "Serie A":"Serie A",
            "Ligue 1":"Ligue 1"
        }[competition];

        return fc27ClubsByLeague[possibleLeague]||[];
    }

    return getAllClubs();
}


function getAllClubs(){

    const clubs=new Set();

    allPlayers.forEach(
        player=>{
            if(player.club)
                clubs.add(player.club);
        }
    );

    return Array.from(clubs).sort();
}


function getEnglishClubs(){

    const clubs=new Set();

    allPlayers.forEach(player=>{

        const league=(player.league||"").toLowerCase();

        if(
            league.includes("premier")
            ||
            league.includes("championship")
            ||
            league.includes("league one")
            ||
            league.includes("league two")
            ||
            league.includes("national")
            ||
            league.includes("england")
        ){

            if(player.club)
                clubs.add(player.club);
        }

    });

    return Array.from(clubs).sort();
}

    const career=getCurrentCareer();

    if(!isParticipatingInCompetition(career,competition)){alert("Join this competition in the Competitions tab before adding matches.");return;}

    const opponent=
        document.getElementById("matchOpponent").value.trim();

    if(!opponent){
        alert("Please select an opponent.");
        return;
    }

    const goalsFor=
        Number(
            document.getElementById("goalsFor").value||0
        );

    const goalsAgainst=
        Number(
            document.getElementById("goalsAgainst").value||0
        );

    let result="D";

    if(goalsFor>goalsAgainst)
        result="W";

    if(goalsFor<goalsAgainst)
        result="L";

    const players=[];

    document.querySelectorAll("#manualPlayers .player-entry").forEach(row=>{
        const get=field=>row.querySelector('[data-field="'+field+'"]')?.value??"";
        const name=get("name").trim();
        if(!name)return;
        const number=value=>value===""?null:Number(value);
        players.push({
            name,
            rating:number(get("rating")),
            goals:number(get("goals"))??0,
            assists:number(get("assists"))??0,
            minutes:number(get("minutes")),
            saves:number(get("saves")),
            yellowCards:number(get("yellowCards"))??0,
            redCards:number(get("redCards"))??0,
            cards:(Number(get("redCards"))>0?"Red":Number(get("yellowCards"))>0?"Yellow":null)
        });
    });

    career.matches.push({

        id:createId(),

        season:career.currentSeason,

        date:
            document.getElementById("matchDate").value,

        competition,

        homeAway:
            document.getElementById("matchHomeAway").value,

        opponent,

        goalsFor,

        goalsAgainst,

        result,

        cleanSheet:goalsAgainst===0,

        entryMethod:"manual",

        players

    });

    saveCareers();

    closeModal();

    renderMatches();
}

function getCareerClubRoster(career){
    const clubName=String(career?.clubName||"").trim().toLowerCase();
    if(!clubName||!Array.isArray(allPlayers))return [];
    let roster=allPlayers.filter(p=>String(p.club||"").trim().toLowerCase()===clubName);
    if(!roster.length){
        const normal=value=>String(value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
        const target=normal(clubName);
        roster=allPlayers.filter(p=>{
            const club=normal(p.club);
            return club&&target&&(club===target||club.includes(target)||target.includes(club));
        });
    }
    const baseRoster=roster;
    if(career && career.squadHub){
        const h=career.squadHub, removed=new Set((h.removedIds||[]).map(String)), added=new Set((h.addedIds||[]).map(String));
        const ids=new Set(baseRoster.map(p=>String(p.id??p.playerId??p.customId??"")));
        (career.squad||[]).concat(allPlayers.filter(p=>added.has(String(p.id??p.playerId??""))),h.customPlayers||[]).forEach(p=>{
            const id=String(p.id??p.playerId??p.customId??"");
            if(id&&!removed.has(id)&&!ids.has(id)){baseRoster.push(p);ids.add(id);}
        });
        return baseRoster.filter(p=>!removed.has(String(p.id??p.playerId??p.customId??"")));
    }
    return baseRoster;
}

function matchRosterPlayer(name,roster){
    const normal=value=>String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
    const wanted=normal(name);
    if(!wanted)return null;
    let found=roster.find(p=>{
        const names=[p.commonName,p.name,[p.firstName,p.lastName].filter(Boolean).join(" "),p.firstName,p.lastName]
            .map(normal).filter(Boolean);
        return names.includes(wanted);
    });
    if(found)return found;
    return roster.find(p=>{
        const names=[p.commonName,p.name,[p.firstName,p.lastName].filter(Boolean).join(" ")]
            .map(normal).filter(Boolean);
        return names.some(n=>n.length>4&&(n.includes(wanted)||wanted.includes(n)));
    })||null;
}

function officialPlayerName(player){
    return player.commonName||[player.firstName,player.lastName].filter(Boolean).join(" ")||player.name||"";
}

function syncAIMatchScorersToGoalColumns(){
    const scorerInput=document.getElementById("aiMatchScorers");
    if(!scorerInput)return;
    const names=scorerInput.value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
    if(!names.length)return;
    const roster=window.__careerAIReviewRoster||[];
    const counts={};
    names.forEach(name=>{
        const player=matchRosterPlayer(name,roster);
        if(player){
            const official=officialPlayerName(player);
            counts[official]=(counts[official]||0)+1;
        }
    });
    document.querySelectorAll("#aiReviewPlayerRows [data-ai-player]").forEach(row=>{
        const nameInput=row.querySelector('[data-ai-field="name"]');
        const goalsInput=row.querySelector('[data-ai-field="goals"]');
        if(!nameInput||!goalsInput)return;
        const player=matchRosterPlayer(nameInput.value.trim(),roster);
        if(player){
            const official=officialPlayerName(player);
            goalsInput.value=counts[official]||0;
        }
    });
}

function addAIReviewPlayer(){
    if(!Array.isArray(window.__careerAIReviewPlayers))window.__careerAIReviewPlayers=[];
    const roster=window.__careerAIReviewRoster||[];
    const used=new Set(window.__careerAIReviewPlayers.map(p=>String(p.playerId)));
    const next=roster.find(p=>!used.has(String(p.id)));
    window.__careerAIReviewPlayers.push({
        playerId:next?.id||null,
        name:next?officialPlayerName(next):"",
        rating:null,goals:0,assists:0,minutes:null,yellowCards:0,redCards:0,saves:null
    });
    renderAIReviewPlayers();
}

function removeAIReviewPlayer(index){
    (window.__careerAIReviewPlayers||[]).splice(index,1);

}

function saveAIReviewPlayerInputs(){
    const rows=document.querySelectorAll("#aiReviewPlayerRows [data-ai-player]");
    const roster=window.__careerAIReviewRoster||[];
    const players=[];
    rows.forEach(row=>{
        const get=field=>row.querySelector('[data-ai-field="'+field+'"]')?.value??"";
        const typedName=get("name").trim();
        if(!typedName)return;
        const matched=matchRosterPlayer(typedName,roster);
        if(!matched){
            alert('"'+typedName+'" is not in your selected club squad. Choose a player from the squad list or remove this row.');
            throw new Error("Player does not match selected squad.");
        }
        if(players.some(p=>String(p.playerId)===String(matched.id))){
            alert('"' + officialPlayerName(matched) + '" appears more than once. Each squad player should only be entered once.');
            throw new Error("Duplicate player.");
        }
        const num=v=>v===""?null:Number(v);
        players.push({
            playerId:matched.id,
            name:officialPlayerName(matched),
            rating:num(get("rating")),
            goals:num(get("goals"))??0,
            assists:num(get("assists"))??0,
            minutes:num(get("minutes")),
            yellowCards:num(get("yellowCards"))??0,
            redCards:num(get("redCards"))??0,
            saves:num(get("saves"))
        });
    });
    return players;
}
function saveAIMatchReview(){
    const career=getCurrentCareer();
    if(!career)return;
    const competition=document.getElementById("aiMatchCompetition").value.trim();
    const opponent=document.getElementById("aiMatchOpponent").value.trim();
    const date=document.getElementById("aiMatchDate").value;
    if(!date){alert("Enter the match date manually before saving.");return;}
    if(!competition||!opponent){alert("Please enter a competition and opponent.");return;}
    if(!isParticipatingInCompetition(career,competition)){alert("Join this competition in the Competitions tab before saving this match.");return;}
    const goalsFor=document.getElementById("aiGoalsFor").value;
    const goalsAgainst=document.getElementById("aiGoalsAgainst").value;
    if(goalsFor===""||goalsAgainst===""){alert("Please confirm the final score before saving.");return;}
    const gf=Number(goalsFor),ga=Number(goalsAgainst);
    let players;
    try{players=saveAIReviewPlayerInputs();}catch(error){return;}
    const scorerText=document.getElementById("aiMatchScorers")?.value||"";
    const scorers=scorerText.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
    const scorerCounts={};
    scorers.forEach(name=>{
        const player=matchRosterPlayer(name,window.__careerAIReviewRoster||[]);
        if(player){
            const official=officialPlayerName(player);
            scorerCounts[official]=(scorerCounts[official]||0)+1;
        }
    });
    players=players.map(p=>({
        ...p,
        goals:scorerCounts[p.name]!==undefined?scorerCounts[p.name]:p.goals
    }));
    career.matches.push({
        id:createId(),season:career.currentSeason,
        date,competition,
        homeAway:document.getElementById("aiMatchHomeAway").value,
        opponent,goalsFor:gf,goalsAgainst:ga,
        result:gf>ga?"W":gf<ga?"L":"D",
        cleanSheet:ga===0,entryMethod:"ai",
        screenshots:aiReviewFiles.slice(),
        scorers,
        players
    });
    saveCareers();
    matchUploadFiles=[];
    closeModal();
    renderMatches();
}

function calendarSeasonBounds(career){
    const label=String(career?.currentSeason||"2026/27");
    const match=label.match(/^(\d{4})\s*\/\s*(\d{2}|\d{4})$/);
    const startYear=match?Number(match[1]):2026;
    return {start:new Date(startYear,6,1),end:new Date(startYear+1,5,30),startYear};
}
function calendarDateKey(date){
    return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}
function calendarMonthChange(delta){
    const career=getCurrentCareer();if(!career)return;
    const bounds=calendarSeasonBounds(career);
    let view=window.__careerCalendarView;
    if(!view||view.season!==career.currentSeason)view={season:career.currentSeason,year:bounds.startYear,month:6};
    const next=new Date(view.year,view.month+delta,1);
    const firstMonth=6,lastMonth=5;
    const min=new Date(bounds.startYear,firstMonth,1),max=new Date(bounds.startYear+1,lastMonth,1);
    if(next<min||next>max)return;
    window.__careerCalendarView={season:career.currentSeason,year:next.getFullYear(),month:next.getMonth()};
    renderCalendar();
}
function calendarDayClick(date){
    const career=getCurrentCareer();if(!career)return;
    const bounds=calendarSeasonBounds(career);
    if(date<calendarDateKey(bounds.start)||date>calendarDateKey(bounds.end))return;
    openManualCalendarEntry("",date);
}
function renderCalendar(){
    const career=getCurrentCareer();
    if(!career){renderDashboard();return;}
    if(!Array.isArray(career.calendar))career.calendar=[];
    const bounds=calendarSeasonBounds(career);
    let view=window.__careerCalendarView;
    if(!view||view.season!==career.currentSeason||new Date(view.year,view.month,1)<new Date(bounds.startYear,6,1)||new Date(view.year,view.month,1)>new Date(bounds.startYear+1,5,1)){
        view={season:career.currentSeason,year:bounds.startYear,month:6};
        window.__careerCalendarView=view;
    }
    const monthStart=new Date(view.year,view.month,1);
    const monthEnd=new Date(view.year,view.month+1,0);
    const gridStart=new Date(view.year,view.month,1-monthStart.getDay());
    const gridEnd=new Date(view.year,view.month,monthEnd.getDate()+(6-monthEnd.getDay()));
    const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
    const seasonCalendar=career.calendar.filter(e=>{
        if(!e||!e.date)return false;
        const date=new Date(e.date+"T12:00:00");
        return date>=bounds.start&&date<=bounds.end&&(!e.season||e.season===career.currentSeason);
    }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const eventByDate={};
    seasonCalendar.forEach(e=>(eventByDate[e.date]||(eventByDate[e.date]=[])).push(e));
    const cells=[];
    for(let d=new Date(gridStart);d<=gridEnd;d.setDate(d.getDate()+1)){
        const dateKey=calendarDateKey(d),inSeason=d>=bounds.start&&d<=bounds.end,inMonth=d.getMonth()===view.month;
        const events=eventByDate[dateKey]||[];
        const eventHtml=events.slice(0,2).map(e=>'<button type="button" class="calendar-day-event '+competitionTheme(e.competition)+'" onclick="event.stopPropagation();openCalendarMatch(\''+escapeJS(e.id)+'\')" title="'+escapeHTML(e.competition+' — '+e.opponent)+'"><span>'+escapeHTML(e.opponent||"Fixture")+'</span></button>').join("");
        const more=events.length>2?'<div class="calendar-day-more">+'+(events.length-2)+' more</div>':"";
        cells.push('<div class="calendar-day '+(!inMonth?'outside-month ':'')+(!inSeason?'out-of-season ':'')+(events.length?'has-fixture':'')+'" '+(inSeason?'role="button" tabindex="0" onclick="calendarDayClick(\''+dateKey+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();calendarDayClick(\''+dateKey+'\')}"':'aria-disabled="true"')+'><div class="calendar-day-number">'+d.getDate()+'</div>'+eventHtml+more+(inSeason&&!events.length?'<div class="calendar-day-add">+ Add match</div>':"")+'</div>');
    }
    const prevDisabled=view.year===bounds.startYear&&view.month===6;
    const nextDisabled=view.year===bounds.startYear+1&&view.month===5;
    document.getElementById("pageContent").innerHTML=`
    ${careerBanner(career)}
    <div class="topbar">
      <div><div class="page-title">Season Calendar</div><div class="page-subtitle">${escapeHTML(career.currentSeason)} · 1 July ${bounds.startYear} – 30 June ${bounds.startYear+1}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="secondary-btn" onclick="openCalendarUpload()">📸 Upload Calendar (AI)</button></div>
    </div>
    <div class="panel calendar-panel">
      <div class="calendar-month-toolbar">
        <button type="button" class="secondary-btn calendar-nav-btn" onclick="calendarMonthChange(-1)" ${prevDisabled?"disabled":""} aria-label="Previous month">‹</button>
        <div class="calendar-month-heading"><div class="panel-title">${monthNames[view.month]} ${view.year}</div><div class="panel-subtitle" style="margin:4px 0 0">${seasonCalendar.length} fixtures this season · Click any day to add a match</div></div>
        <button type="button" class="secondary-btn calendar-nav-btn" onclick="calendarMonthChange(1)" ${nextDisabled?"disabled":""} aria-label="Next month">›</button>
      </div>
      <div class="calendar-season-strip"><span>Season starts <strong>1 Jul ${bounds.startYear}</strong></span><span>Season ends <strong>30 Jun ${bounds.startYear+1}</strong></span></div>
      <div class="calendar-grid">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(day=>'<div class="calendar-weekday">'+day+'</div>').join("")}
        ${cells.join("")}
      </div>
      <div class="calendar-legend"><span><i class="calendar-legend-dot"></i> Scheduled fixture</span><span>Click a date to add a fixture</span></div>
      <div class="calendar-footer-actions"><button type="button" class="primary-btn" onclick="openManualCalendarEntry()">＋ Add Fixture</button><button type="button" class="secondary-btn" onclick="openCalendarUpload()">📸 Upload Calendar Screenshots</button></div>
    </div>`;
}

function competitionTheme(competition){

    const c=(competition||"").toLowerCase();

    if(c.includes("premier"))
        return "theme-premier";

    if(c.includes("fa cup"))
        return "theme-fa";

    if(c.includes("carabao"))
        return "theme-carabao";

    if(c.includes("champions"))
        return "theme-champions";

    if(c.includes("europa"))
        return "theme-europa";

    if(c.includes("conference"))
        return "theme-conference";

    if(c.includes("la liga"))
        return "theme-la-liga";

    if(c.includes("bundesliga"))
        return "theme-bundesliga";

    if(c.includes("serie"))
        return "theme-seriea";

    if(c.includes("ligue"))
        return "theme-ligue1";

    if(c.includes("friendly"))
        return "theme-friendly";

    if(c.includes("world cup"))
        return "theme-worldcup";

    if(
        c.includes("international")
        ||
        c.includes("nations")
        ||
        c.includes("european championship")
    )
        return "theme-international";

    return "theme-friendly";
}

function saveManualCalendarEntry(eventId){
    const career=getCurrentCareer();
    if(!career)return;
    const value=id=>document.getElementById(id)?.value.trim()||"";
    const date=value("manualCalendarDate"),competition=value("manualCalendarCompetition"),opponent=value("manualCalendarOpponent");
    if(!date||!competition||!opponent){alert("Please enter a date, competition and opponent.");return;}
    const bounds=calendarSeasonBounds(career);
    if(date<calendarDateKey(bounds.start)||date>calendarDateKey(bounds.end)){alert("Fixtures must be between 1 July "+bounds.startYear+" and 30 June "+(bounds.startYear+1)+".");return;}
    if(!Array.isArray(career.calendar))career.calendar=[];
    const duplicate=career.calendar.find(e=>e.id!==eventId&&e.date===date&&(e.opponent||"").toLowerCase()===opponent.toLowerCase()&&(e.competition||"").toLowerCase()===competition.toLowerCase());
    if(duplicate){alert("That fixture is already in your calendar.");return;}
    const event={date,competition,opponent,homeAway:value("manualCalendarHomeAway"),round:value("manualCalendarRound"),notes:value("manualCalendarNotes")};
    if(eventId){
        const index=career.calendar.findIndex(e=>e.id===eventId);
        if(index>=0)career.calendar[index]={...career.calendar[index],...event,source:"manual"};
    }else{
        career.calendar.push({id:createId(),season:career.currentSeason,...event,favorite:false,source:"manual"});
    }
    saveCareers();
    closeModal();
    renderCalendar();
}

function saveAICalendarReview(){
    const career=getCurrentCareer();
    if(!career)return;
    const rows=document.querySelectorAll("#aiCalendarReviewRows [data-ai-calendar]");
    const extracted=[];
    rows.forEach(row=>{
        const get=field=>row.querySelector('[data-event-field="'+field+'"]')?.value.trim()||"";
        const event={date:get("date"),competition:get("competition"),opponent:get("opponent"),homeAway:get("homeAway"),round:get("round"),notes:get("notes")};
        if(event.date&&event.competition&&event.opponent)extracted.push(event);
    });
    if(!extracted.length){
        alert("Add at least one fixture with a date, competition and opponent.");
        return;
    }
    if(!Array.isArray(career.calendar))career.calendar=[];
    const existing=new Set(career.calendar.map(e=>[e.date,e.competition,e.opponent].join("|").toLowerCase()));
    let added=0;
    const bounds=calendarSeasonBounds(career);
    let outsideSeason=0;
    extracted.forEach(event=>{
        if(event.date<calendarDateKey(bounds.start)||event.date>calendarDateKey(bounds.end)){outsideSeason++;return;}
        const key=[event.date,event.competition,event.opponent].join("|").toLowerCase();
        if(existing.has(key))return;
        existing.add(key);
        career.calendar.push({
            id:createId(),season:career.currentSeason,
            date:event.date,competition:event.competition,
            opponent:event.opponent,homeAway:event.homeAway,
            round:event.round,notes:event.notes,
            favorite:false,source:"ai",
            screenshots:aiReviewFiles.slice()
        });
        added++;
    });
    const season=getSeason(career);
    if(season)season.calendarUploaded=true;
    saveCareers();
    calendarUploadFiles=[];
    closeModal();
    renderCalendar();
    if(outsideSeason)alert(`Saved ${added} fixtures. ${outsideSeason} fixture(s) outside 1 July ${bounds.startYear} – 30 June ${bounds.startYear+1} were skipped.`);
    else if(added===0)alert("No new fixtures were added because all reviewed fixtures were already in your calendar.");
    else if(added<extracted.length)alert(`Saved ${added} new fixtures. Duplicate fixtures were skipped.`);
}

function addYouthPlayer(event){
    event.preventDefault();
    const c=getCurrentCareer();if(!c)return;
    const name=document.getElementById("youthName").value.trim();
    const position=document.getElementById("youthPosition").value;
    const country=document.getElementById("youthCountry").value.trim();
    const age=Number(document.getElementById("youthAge").value);
    const min=Number(document.getElementById("youthPotentialMin").value);
    const max=Number(document.getElementById("youthPotentialMax").value);
    if(!name||!position||!country||!Number.isInteger(age)||age<1||age>99){alert("Please fill in all player details with a valid age.");return;}
    if(!Number.isInteger(min)||!Number.isInteger(max)||min<1||max>99||max<min){alert("Potential must be between 1 and 99, and the maximum must be at least the minimum.");return;}
    if(!Array.isArray(c.youthAcademy))c.youthAcademy=[];
    c.youthAcademy.push({id:"youth_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),name,position,country,age,potentialMin:min,potentialMax:max,createdAt:todayDate()});
    saveCareers();
    renderYouthAcademy();
}

function deleteYouthPlayer(id){
    const c=getCurrentCareer();if(!c||!Array.isArray(c.youthAcademy))return;
    const p=c.youthAcademy.find(x=>String(x.id)===String(id));
    if(!p||!confirm("Delete "+(p.name||"this youth player")+" from your Youth Academy?"))return;
    c.youthAcademy=c.youthAcademy.filter(x=>String(x.id)!==String(id));
    saveCareers();renderYouthAcademy();
}

 const country=nationalCountryKey(c&&c.nationalTeam);
 return (Array.isArray(allPlayers)?allPlayers:[]).filter(p=>{
  const n=nationalCountryKey(p.nationality||p.country||"");

/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    const rows=[];
    let row=[];
    let value="";
    let insideQuotes=false;

    for(let i=0;i<text.length;i++){

        const char=text[i];
        const next=text[i+1];

        if(char==='"'&&insideQuotes&&next==='"'){
            value+='"';
            i++;
            continue;
        }

        if(char==='"'){
            insideQuotes=!insideQuotes;
            continue;
        }

        if(char===","&&!insideQuotes){

            row.push(value);
            value="";
            continue;
        }

        if(
            (char==="\n"||char==="\r")
            &&
            !insideQuotes
        ){

            if(char==="\r"&&next==="\n")
                i++;

            row.push(value);
            value="";

            if(row.some(x=>x.trim()!==""))
                rows.push(row);

            row=[];

            continue;
        }

        value+=char;
    }

    if(value!==""||row.length){

        row.push(value);

        if(row.some(x=>x.trim()!==""))
            rows.push(row);
    }

    if(!rows.length)
        return[];

    const headers=rows[0].map(x=>x.trim());

    return rows.slice(1).map(row=>{

        const obj={};

        headers.forEach(
            (header,i)=>{
                obj[header]=
                    row[i]!==undefined
                    ?row[i].trim()
                    :"";
            }
        );

        return obj;
    });
}


function getPlayerValue(row,names){

    for(const name of names){

        if(
            row[name]!==undefined
            &&
            row[name]!==""
        )
            return row[name];
    }

    return "";
}


function calculateAge(birthdate){

    if(!birthdate)return"";

    const date=new Date(birthdate);

    if(isNaN(date.getTime()))
        return"";

    const now=new Date();

    let age=
        now.getFullYear()-
        date.getFullYear();

    const month=
        now.getMonth()-
        date.getMonth();

    if(
        month<0
        ||
        (
            month===0
            &&
            now.getDate()<date.getDate()
        )
    )
        age--;

    return age;
}


function convertPlayer(row){

    return{

        id:getPlayerValue(row,["id"]),

        rank:getPlayerValue(row,["rank"]),

        overallRating:getPlayerValue(
            row,
            ["overallRating","overall","rating"]
        ),

        firstName:getPlayerValue(

        ),

        lastName:getPlayerValue(

        ),

        commonName:getPlayerValue(

        ),

        birthdate:getPlayerValue(

        ),

        age:calculateAge(

        ),

        league:getPlayerValue(

}


function buildFC27LeagueDatabase(){

    const leagueSet=new Set();
    const clubsByLeague={};

    allPlayers.forEach(player=>{

        const league=player.league;
        const club=player.club;

        if(!league)return;

        leagueSet.add(league);

        if(!clubsByLeague[league])
            clubsByLeague[league]=new Set();

        if(club)
            clubsByLeague[league].add(club);
    });

    fc27Leagues=
        Array.from(leagueSet)
        .sort((a,b)=>a.localeCompare(b));

    fc27ClubsByLeague={};

    Object.keys(clubsByLeague).forEach(
        league=>{

            fc27ClubsByLeague[league]=
                Array.from(
                    clubsByLeague[league]
                ).sort(
                    (a,b)=>a.localeCompare(b)
                );
        }
    );
}

// Public Worker URL only. The OpenRouter API key stays in Cloudflare.
const CAREER_AI_URL = "https://career-mode-ai.rowanpetersen209.workers.dev/";

function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(new Error("Could not read screenshot."));
        reader.readAsDataURL(file);
    });
}

async function analyseCareerScreenshots(task,files){
    if(!["match","calendar","league","transfer","youth"].includes(task))
        throw new Error("Unknown AI task.");
    if(!files||files.length<1||files.length>4)
        throw new Error("Choose between 1 and 4 screenshots at a time.");
    const images=[];
    let total=0;
    for(const file of Array.from(files)){
        if(!["image/png","image/jpeg","image/webp"].includes(file.type))
            throw new Error("Use PNG, JPEG or WebP screenshots.");
        if(file.size>8*1024*1024)
            throw new Error("A screenshot is over 8 MB. Please resize it.");
        const data=await fileToDataURL(file);
        total+=data.length;
        if(total>12_000_000)
            throw new Error("These screenshots are too large together. Upload fewer screenshots at a time.");
        images.push(data);
    }
    let response;
    try{
        response=await fetch(CAREER_AI_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({task,images,clubName:getCurrentCareer()?.clubName||""})
        });
    }catch(e){
        throw new Error("Could not reach the Cloudflare Worker. Check its URL and deployment.");
    }
    let result;
    try{result=await response.json();}
    catch(e){throw new Error("The AI server returned an unreadable response.");}
    if(!response.ok||!result.ok)
        throw new Error(result.error||("AI request failed ("+response.status+")."));
    if(!result.data||typeof result.data!=="object")
        throw new Error("AI returned no usable extracted data.");
    return result.data;
}

function formatDate(dateString){

    if(!dateString)return"—";

    const date=new Date(
        dateString+"T00:00:00"
    );

    if(isNaN(date.getTime()))
        return dateString;

    const day=String(date.getDate()).padStart(2,"0");
    const month=String(date.getMonth()+1).padStart(2,"0");
    const year=String(date.getFullYear());
    return day+"/"+month+"/"+year;
}


function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJS(value){

    return String(value??"")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}

function friendlyAuthError(e){
  const msg=String(e?.message||e||"Unknown error");
  if(/invalid login credentials/i.test(msg))return "Email or password is incorrect.";
  if(/email not confirmed/i.test(msg))return "Please confirm your email using the link we sent you.";
  if(/user already registered/i.test(msg))return "An account with this email already exists. Try logging in.";
  if(/password should be at least/i.test(msg))return "Use a password with at least 8 characters.";
  if(/failed to fetch|network/i.test(msg))return "Could not reach Supabase. Check the project URL and internet connection.";
  if(/relation .* does not exist|could not find the table/i.test(msg))return "The cloud-save table has not been created yet. Follow the SQL setup steps in ChatGPT.";
  return msg;
}
async function submitAuthForm(){
  if(!supabaseClient){showAuthError("Login service is not ready. Refresh and try again.");return;}
  const email=document.getElementById("authEmail")?.value.trim()||"",password=document.getElementById("authPassword")?.value||"",username=document.getElementById("authUsername")?.value.trim()||"";
  if(!email||!password){showAuthError("Enter your email and password.");return;}
  if(password.length<8){showAuthError("Use a password with at least 8 characters.");return;}
  if(authMode==="signup"&&!/^[a-zA-Z0-9_.-]{3,24}$/.test(username)){showAuthError("Username must be 3–24 characters and use letters, numbers, dots, underscores or hyphens.");return;}
  const btn=document.getElementById("authSubmit");if(btn){btn.disabled=true;btn.textContent="Please wait…";}
  try{
    let result;
    if(authMode==="signup"){
      result=await supabaseClient.auth.signUp({email,password,options:{data:{username}}});if(result.error)throw result.error;
      if(!result.data.session){showAuthError("Account created. Check your email and click the confirmation link, then log in here.");if(btn){btn.disabled=false;btn.textContent="Create account";}return;}
    }else{result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;}
    document.getElementById("authOverlay")?.remove();signedInUser=result.data.user||result.data.session?.user||signedInUser;updateAccountPanel();await loadCloudCareers();
  }catch(e){showAuthError(friendlyAuthError(e));if(btn){btn.disabled=false;btn.textContent=authMode==="signup"?"Create account":"Log in";}}
}
function showAuthError(message){const el=document.getElementById("authError");if(el)el.textContent=message;}
async function sendPasswordReset(){
  const email=document.getElementById("authEmail")?.value.trim()||"";if(!email){showAuthError("Enter your email above first.");return;}
  try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;showAuthError("Password reset email sent if an account exists for that address. Check your inbox.");}catch(e){showAuthError(friendlyAuthError(e));}
}
async function signOutAccount(){
  if(!supabaseClient)return;
  try{await flushCloudSave();const {error}=await supabaseClient.auth.signOut();if(error)throw error;signedInUser=null;cloudReady=false;updateAccountPanel();alert("Signed out. Your careers remain saved on this device.");}
  catch(e){alert("Could not sign out cleanly: "+friendlyAuthError(e));}
}
async function loadCloudCareers(){
  if(!supabaseClient||!signedInUser||cloudLoading)return;
  cloudLoading=true;cloudReady=false;setAccountStatus("Loading your private cloud saves…");
  try{
    const {data,error}=await supabaseClient.from("career_mode_hub_saves").select("careers").eq("user_id",signedInUser.id).maybeSingle();if(error)throw error;
    const local=Array.isArray(careers)?careers:[],remote=data&&Array.isArray(data.careers)?data.careers:[];
    if(remote.length){
      const byId=new Map();remote.forEach(c=>byId.set(String(c.id),c));local.forEach(c=>byId.set(String(c.id),c));careers=Array.from(byId.values());
      localStorage.setItem("careerModeHubCareers",JSON.stringify(careers));if(currentCareerId&&!careers.some(c=>c.id===currentCareerId))currentCareerId=null;showPage(document.body.dataset.page||(currentCareerId?"mycareer":"dashboard"));
    }
    cloudReady=true;updateAccountPanel();
    if(remote.length===0&&local.length){
      const {error:saveError}=await supabaseClient.from("career_mode_hub_saves").upsert({user_id:signedInUser.id,careers:JSON.parse(JSON.stringify(careers)),updated_at:new Date().toISOString()},{onConflict:"user_id"});
      if(saveError)throw saveError;
    }
    setAccountStatus("Signed in as "+(signedInUser.user_metadata?.username||signedInUser.email)+" · cloud saves up to date");
  }catch(e){
    cloudReady=false;setAccountStatus("Signed in, but cloud saves need setup.");
    alert("Login worked, but cloud saves are not ready yet. "+friendlyAuthError(e)+"\n\nThe Supabase save table and its security policies must be created first. Your local careers have not been deleted.");
  }finally{cloudLoading=false;}
}
function scheduleCloudSave(){
  if(!signedInUser||!cloudReady||cloudLoading)return;
  if(cloudSaveTimer)clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>flushCloudSave(),900);
}
async function flushCloudSave(){
  if(!supabaseClient||!signedInUser||!cloudReady||cloudLoading)return;
  if(cloudSaveTimer){clearTimeout(cloudSaveTimer);cloudSaveTimer=null;}
  const snapshot=JSON.parse(JSON.stringify(careers)),userId=signedInUser.id;
  const {error}=await supabaseClient.from("career_mode_hub_saves").upsert({user_id:userId,careers:snapshot,updated_at:new Date().toISOString()},{onConflict:"user_id"});
  if(error){setAccountStatus("Cloud save failed. Local save is still safe.");console.error("Career Mode Hub cloud save failed:",error);return;}
  setAccountStatus("Signed in as "+(signedInUser.user_metadata?.username||signedInUser.email)+" · cloud saves up to date");
}

function playerCareerStats(c, filter){
  const matches=(c.matches||[]).filter(m=>!m.international&&(!filter||m.season===filter));
  const goals=matches.reduce((n,m)=>n+(Number(m.goals)||0),0);
  const assists=matches.reduce((n,m)=>n+(Number(m.assists)||0),0);
  const minutes=matches.reduce((n,m)=>n+(Number(m.minutes)||0),0);
  const rated=matches.filter(m=>m.rating!==null&&m.rating!==undefined&&m.rating!==""&&Number.isFinite(Number(m.rating)));
  const avg=rated.length?(rated.reduce((n,m)=>n+Number(m.rating),0)/rated.length).toFixed(2):"—";
  const wins=matches.filter(m=>m.result==="W").length;
  const draws=matches.filter(m=>m.result==="D").length;
  const losses=matches.filter(m=>m.result==="L").length;
  const yellow=matches.reduce((n,m)=>n+(Number(m.yellowCards)||0),0);
  const red=matches.reduce((n,m)=>n+(Number(m.redCards)||0),0);
  return {appearances:matches.length,goals:goals,assists:assists,minutes:minutes,average:avg,wins:wins,draws:draws,losses:losses,yellow:yellow,red:red,matches:matches};
}

function savePlayerContract(e){e.preventDefault();const c=getCurrentCareer();if(!c)return;const f=new FormData(e.target);c.contract={expiry:String(f.get("expiry")||"").trim(),wage:f.get("wage")?Number(f.get("wage")):null,currency:String(f.get("currency")||"EUR"),role:String(f.get("role")||"Not set"),agent:String(f.get("agent")||"").trim(),goal:String(f.get("goal")||"").trim()};saveCareers();renderPlayerCareerPage("contract");}
function savePCObjectives(e){e.preventDefault();const c=getCurrentCareer();if(!c)return;const f=new FormData(e.target);if(!c.seasonObjectives)c.seasonObjectives={};c.seasonObjectives[c.currentSeason]={objective:String(f.get("objective")||"").trim(),apps:f.get("apps")===""?null:Number(f.get("apps")),goals:f.get("goals")===""?null:Number(f.get("goals")),assists:f.get("assists")===""?null:Number(f.get("assists")),rating:f.get("rating")===""?null:Number(f.get("rating"))};saveCareers();renderPlayerCareerPage("objectives");}


function pcCareerPayload(c){
 const p=c.player||{},season=c.currentSeason,st=playerCareerStats(c,season),prev=pcPrev(c),strength=pcStrength(c);
 const matches=(c.matches||[]).filter(x=>!x.international).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).slice(0,12);
 return {player:{name:p.name||"",age:pcAge(c),position:p.position||"",overall:Number(p.overall)||Number((c.seasonOverallRatings||{})[season])||null,transferValue:p.transferValue??null},club:{name:c.clubName||"",league:c.league||"",season:season||"",strengthEstimate:strength},currentSeasonStats:st,previousSeasonStats:prev,contract:c.contract||{},seasonObjectives:(c.seasonObjectives||{})[season]||{},recentMatches:matches.map(m=>({date:m.date||null,opponent:m.opponent||null,competition:m.competition||null,score:m.goalsFor!=null?String(m.goalsFor)+"-"+String(m.goalsAgainst??"?"):null,goals:Number(m.goals)||0,assists:Number(m.assists)||0,rating:m.rating??null,minutes:m.minutes??null,manOfTheMatch:!!m.manOfTheMatch})),trophies:(c.trophies||[]).slice(-12).map(t=>({name:t.name||t.trophy||t.title||"",season:t.season||"",competition:t.competition||""}))};
}
async function requestPlayerCareerAI(kind){
 const c=getCurrentCareer();if(!c||c.mode!=="player")return;
 const button=document.querySelector('[data-kind="'+kind+'"]');if(button){button.disabled=true;button.textContent="AI is thinking…";}
 try{
  const response=await fetch(CAREER_AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:"career_assist",clubName:c.clubName||"",careerData:pcCareerPayload(c)})});
  let result;try{result=await response.json();}catch(e){throw new Error("The AI server returned an unreadable response.");}
  if(!response.ok||!result.ok)throw new Error(result.error||("AI request failed ("+response.status+")."));
  if(!result.data||!result.data.prediction)throw new Error("The AI did not return usable career advice.");
  c.aiCareerInsights={generatedAt:new Date().toISOString(),model:result.model||"OpenRouter",prediction:result.data.prediction,agentAdvice:result.data.agentAdvice||[],news:result.data.news||[],pressConference:result.data.pressConference||[]};
  saveCareers();renderPlayerCareerPage(kind==="news"?"media":kind==="agent"?"contract":"objectives");
 }catch(e){alert("Player Career AI failed: "+(e.message||"Unknown error")+". If the Worker reports an unknown task, update and deploy cloudflare-worker.js in your existing career-mode-ai Worker.");if(button){button.disabled=false;button.textContent=kind==="news"?"Generate AI News & Press Conference":kind==="agent"?"Get AI Agent Advice":"Generate AI Predictions & Objectives";}}
}

 if(kind==="objectives"){const p=a.prediction||{};return '<div style="margin-top:14px"><div style="font-size:12px;color:#8dd5ff">AI report · '+escapeHTML(date)+'</div><h3>'+escapeHTML(p.summary||"Season outlook")+'</h3><div class="match-summary-grid">'+playerStatCard("AI Appearances",p.expectedAppearances??"—")+playerStatCard("AI Goals",p.expectedGoals??"—")+playerStatCard("AI Assists",p.expectedAssists??"—")+playerStatCard("Target Rating",p.targetAverageRating??"—")+'</div><p style="color:#c5ced8;line-height:1.7"><b>Recommended objective:</b> '+escapeHTML(p.recommendedObjective||"—")+'</p><p style="color:#c5ced8;line-height:1.7">'+escapeHTML(p.reasoning||"")+'</p><p style="color:#aab3bf;line-height:1.7"><b>Club assessment:</b> '+escapeHTML(p.clubAssessment||"Not enough comparison data.")+'<br><b>Player assessment:</b> '+escapeHTML(p.playerAssessment||"")+'<br><b>Confidence:</b> '+escapeHTML(p.confidence||"unspecified")+'</p></div>';}
 if(kind==="agent")return '<div style="margin-top:14px"><div style="font-size:12px;color:#8dd5ff">AI agent report · '+escapeHTML(date)+'</div><ul style="line-height:1.8;color:#c5ced8">'+(a.agentAdvice||[]).map(x=>'<li>'+escapeHTML(x)+'</li>').join("")+'</ul></div>';

}

function playerCareerCompetitionOptions(c){
  const defaults=["League","Domestic Cup","Continental Cup","Friendly"];
  const chosen=Array.isArray(c.participatingCompetitions)?c.participatingCompetitions:[];
  const league=String(c.league||"").trim();
  return [...new Set([...chosen,...(league?[league]:[])].map(x=>String(x||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}

function addPlayerCareerCompetition(event){
  event.preventDefault();const c=getCurrentCareer();if(!c)return;
  const form=event.target;const value=String(form.elements.namedItem("competition")?.value||"").trim();
  if(!value)return;
  if(!Array.isArray(c.participatingCompetitions))c.participatingCompetitions=[];
  if(!c.participatingCompetitions.includes(value))c.participatingCompetitions.push(value);
  saveCareers();renderPlayerCareerPage("competitions");
}
function removePlayerCareerCompetition(value){
  const c=getCurrentCareer();if(!c)return;
  if(!confirm("Remove "+value+" from your participating competitions? Existing matches will stay in Full History."))return;
  c.participatingCompetitions=(c.participatingCompetitions||[]).filter(x=>x!==value);
  saveCareers();renderPlayerCareerPage("competitions");
}
function playerCareerOpponentValues(c,international){
  if(international)return getCountryOptions().filter(x=>x.toLowerCase()!==(c.player?.nationalTeam||c.nationalTeam||"").toLowerCase());
  const league=String(c.league||"").trim();
  const aliases={club:["club","team","teamName","team_name","clubName"],league:["league","leagueName","league_name","competition"]};
  const clubs=(Array.isArray(allPlayers)?allPlayers:[]).filter(p=>{
    if(!league)return true;
    return String(aliases.league.map(k=>p&&p[k]).find(Boolean)||"").trim()===league;
  }).map(p=>String(aliases.club.map(k=>p&&p[k]).find(Boolean)||"").trim()).filter(Boolean);
  return [...new Set(clubs)].filter(x=>x.toLowerCase()!==(c.clubName||"").toLowerCase()).sort((a,b)=>a.localeCompare(b));
}

}

function syncPlayerMotmAwards(c){
 if(!c||c.mode!=="player")return false;
 if(!Array.isArray(c.trophies))c.trophies=[];
 const matches=Array.isArray(c.matches)?c.matches:[];
 const matchIds=new Set(matches.map(m=>String(m.id)));
 let changed=false;
 matches.forEach(m=>{
  if(!m.id)return;
  const index=c.trophies.findIndex(t=>String(t.linkedMatchId||"")===String(m.id));
  if(m.manOfTheMatch){
   if(index<0){
    c.trophies.push({id:createId(),award:"Man of the Match",competition:m.competition||"Match award",type:"Individual Award",date:m.date||"",season:m.season||c.currentSeason||"",team:m.clubName||(m.international?(m.nationalTeam||"National Team"):c.clubName)||c.clubName||"",playerCareer:true,linkedMatchId:m.id,awardReason:"Awarded Man of the Match"});
    changed=true;
   }else{
    const t=c.trophies[index];
    const next={award:"Man of the Match",competition:m.competition||"Match award",type:"Individual Award",date:m.date||"",season:m.season||c.currentSeason||"",team:m.clubName||(m.international?(m.nationalTeam||"National Team"):c.clubName)||c.clubName||"",awardReason:"Awarded Man of the Match"};
    Object.keys(next).forEach(k=>{if(t[k]!==next[k]){t[k]=next[k];changed=true;}});
   }
  }else if(index>=0){
   c.trophies.splice(index,1);changed=true;
  }
 });
 const before=c.trophies.length;
 c.trophies=c.trophies.filter(t=>!t.linkedMatchId||matchIds.has(String(t.linkedMatchId)));
 if(c.trophies.length!==before)changed=true;
 return changed;
}

}

 const awards=[["Man of the Match",/man of the match|motm|player of the match/i],["Player of the Month",/player of the month/i],["Player of the Season",/player of the season|season player/i],["Playmaker of the Season",/playmaker of the season/i],["Ballon d’Or",/ballon d.?or/i],["Golden Boot",/golden boot/i],["Golden Glove",/golden glove/i],["Team of the Week",/team of the week|totw/i],["Team of the Season",/team of the season|tots/i],["Team of the Year",/team of the year|toty/i],["Player of the Tournament",/player of the tournament/i]];
 return awards.map(([name,re])=>'<div class="award-count-row"><span class="award-count-name">'+escapeHTML(name)+'</span><span class="award-count-value">'+(c.trophies||[]).filter(t=>String(t.type||"").toLowerCase()!=="team trophy"&&re.test(String(t.award||""))).length+'</span></div>').join("");
}
function playerCareerTeamTrophiesWon(c){
 const won=(c.trophies||[]).filter(t=>String(t.type||"").toLowerCase()==="team trophy");
 if(!won.length)return '<p style="color:#8d97a3">No team trophies won yet.</p>';
 return '<div style="overflow-x:auto"><table class="data-table" style="width:100%;border-collapse:collapse"><thead><tr><th>Trophy</th><th>Team</th><th>Season</th><th>Date</th></tr></thead><tbody>'+won.slice().reverse().map(t=>'<tr><td>'+escapeHTML(t.competition||t.award||"Team Trophy")+'</td><td>'+escapeHTML(t.team||c.clubName||"—")+'</td><td>'+escapeHTML(t.season||"—")+'</td><td>'+escapeHTML(t.date||"—")+'</td></tr>').join("")+'</tbody></table></div>';
