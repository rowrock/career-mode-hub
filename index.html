<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Mode Hub</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #f5f7fa;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 230px;
    background: #11161d;
    border-right: 1px solid #252c35;
    padding: 24px 14px;
    z-index: 10;
    overflow-y: auto;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    padding: 8px 12px 25px;
}

.logo span {
    color: #4da3ff;
}

.nav-title {
    color: #707986;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0 12px 8px;
    letter-spacing: 1px;
}

.nav-btn {
    width: 100%;
    background: transparent;
    border: 0;
    color: #9ca5b1;
    text-align: left;
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 3px;
    font-size: 14px;
}

.nav-btn:hover {
    background: #1a2028;
    color: white;
}

.nav-btn.active {
    background: #1d2835;
    color: white;
    font-weight: 700;
}

.nav-btn.disabled {
    opacity: 0.55;
}

/* =========================
   MAIN
========================= */

.main {
    margin-left: 230px;
    min-height: 100vh;
    padding: 32px 38px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.page-title {
    font-size: 28px;
    font-weight: 800;
}

.page-subtitle {
    color: #7f8996;
    margin-top: 5px;
    font-size: 14px;
}

/* =========================
   BUTTONS
========================= */

.primary-btn {
    background: #3288e8;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
}

.primary-btn:hover {
    background: #2576d0;
}

.secondary-btn {
    background: #1a2028;
    color: #e7ebf0;
    border: 1px solid #303844;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: 600;
}

.secondary-btn:hover {
    background: #222a34;
}

.delete-btn {
    background: transparent;
    border: 1px solid #493038;
    color: #d97886;
    padding: 9px 13px;
    border-radius: 7px;
}

.delete-btn:hover {
    background: #24161a;
}

.small-btn {
    padding: 8px 11px;
    font-size: 12px;
}

/* =========================
   DASHBOARD
========================= */

.careers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
}

.career-card {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 20px;
    transition: 0.15s;
}

.career-card:hover {
    border-color: #3b4653;
    transform: translateY(-2px);
}

.career-name {
    font-size: 19px;
    font-weight: 800;
}

.career-club {
    color: #d8dde4;
    margin-top: 5px;
}

.career-league {
    color: #7f8996;
    font-size: 13px;
    margin-top: 3px;
}

.career-season {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid #252c35;
    display: flex;
    justify-content: space-between;
    color: #8d97a3;
    font-size: 13px;
}

.season-value {
    color: white;
    font-weight: 700;
}

.career-actions {
    display: flex;
    gap: 8px;
    margin-top: 17px;
}

.career-actions .primary-btn {
    flex: 1;
}

.empty-state {
    background: #11161d;
    border: 1px dashed #303844;
    border-radius: 12px;
    padding: 55px 20px;
    text-align: center;
    color: #7f8996;
}

.empty-state h2 {
    color: white;
    margin-top: 0;
}

/* =========================
   CAREER BANNER
========================= */

.career-banner {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 24px;
}

.career-banner-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.current-career-label {
    color: #737d89;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
}

.current-career-name {
    font-size: 22px;
    font-weight: 800;
    margin-top: 4px;
}

.current-career-info {
    color: #8d97a3;
    font-size: 13px;
    margin-top: 5px;
}

.back-dashboard {
    background: #1a2028;
    border: 1px solid #303844;
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
}

/* =========================
   PANELS
========================= */

.panel {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 22px;
}

.panel-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 5px;
}

.panel-subtitle {
    color: #7f8996;
    font-size: 13px;
    margin-bottom: 20px;
}

/* =========================
   STATS
========================= */

.match-summary-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}

.match-stat {
    background: #171d25;
    border: 1px solid #252c35;
    border-radius: 9px;
    padding: 15px;
}

.match-stat-label {
    color: #7f8996;
    font-size: 11px;
    text-transform: uppercase;
}

.match-stat-number {
    font-size: 23px;
    font-weight: 800;
    margin-top: 6px;
}

/* =========================
   SETUP
========================= */

.setup-wrapper {
    max-width: 760px;
}

.setup-panel {
    background: #11161d;
    border: 1px solid #252c35;
    border-radius: 12px;
    padding: 28px;
}

.setup-section {
    margin-bottom: 28px;
}

.setup-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
}

.type-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.type-btn {
    background: #171d25;
    border: 1px solid #303844;
    color: #cdd3db;
    border-radius: 9px;
    padding: 17px;
    text-align: left;
}

.type-btn strong {
    display: block;
    color: white;
    margin-bottom: 5px;
}

.type-btn span {
    color: #7f8996;
    font-size: 12px;
}

.type-btn.selected {
    border-color: #3288e8;
    background: #152337;
}

.form-input,
.search-input,
.form-select {
    width: 100%;
    background: #171d25;
    border: 1px solid #303844;
    color: white;
    padding: 12px 13px;
    border-radius: 8px;
    outline: none;
}

.form-input:focus,
.search-input:focus,
.form-select:focus {
    border-color: #3288e8;
}

/* =========================
   SEARCH
========================= */

.search-select {
    position: relative;
}

.search-results {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    background: #171d25;
    border: 1px solid #303844;
    border-radius: 8px;
    max-height: 250px;
    overflow-y: auto;
    z-index: 50;
    display: none;
}

.search-results.open {
    display: block;
}

.search-option {
    padding: 11px 13px;
    cursor: pointer;
    border-bottom: 1px solid #242b34;
    font-size: 13px;
}

.search-option:hover {
    background: #222a34;
}

/* =========================
   MATCH LIST
========================= */

.match-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.match-row {
    background: #171d25;
    border: 1px solid #252c35;
    border-radius: 9px;
    padding: 16px;
}

.match-row-main {
    display: grid;
    grid-template-columns: 90px 1fr 100px 90px;
    align-items: center;
    gap: 15px;
}

.match-date {
    color: #7f8996;
    font-size: 12px;
}

.match-competition {
    color: #7f8996;
    font-size: 11px;
    margin-top: 4px;
}

.match-opponent {
    font-weight: 800;
    font-size: 15px;
}

.match-home-away {
    color: #8d97a3;
    font-size: 12px;
    margin-top: 4px;
}

.match-score {
    text-align: center;
    font-size: 21px;
    font-weight: 800;
}

.match-result {
    text-align: center;
    font-weight: 800;
}

.result-win {
    color: #69d38b;
}

.result-draw {
    color: #e0bd68;
}

.result-loss {
    color: #e27684;
}

.match-details {
    border-top: 1px solid #252c35;
    margin-top: 14px;
    padding-top: 12px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    color: #8d97a3;
    font-size: 12px;
}

/* =========================
   ENTRY CHOICE
========================= */

.entry-choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.entry-choice {
    background: #171d25;
    border: 1px solid #303844;
    border-radius: 11px;
    padding: 25px;
    text-align: left;
    color: white;
}

.entry-choice:hover {
    border-color: #3288e8;
    background: #152337;
}

.entry-icon {
    font-size: 30px;
    margin-bottom: 13px;
}

.entry-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 7px;
}

.entry-description {
    color: #7f8996;
    font-size: 13px;
    line-height: 1.5;
}

/* =========================
   PLAYER ENTRY
========================= */

.player-entry-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}

.player-entry {
    background: #171d25;
    border: 1px solid #252c35;
    border-radius: 9px;
    padding: 13px;
    display: grid;
    grid-template-columns: 1fr 90px 75px 75px 80px 35px;
    gap: 8px;
    align-items: center;
}

.player-entry-header {
    color: #737d89;
    font-size: 10px;
    text-transform: uppercase;
    padding: 0 13px;
}

.player-name-input {
    min-width: 0;
}

.remove-player {
    background: transparent;
    border: 0;
    color: #d97886;
    font-size: 20px;
}

.add-player-area {
    margin-top: 14px;
}

/* =========================
   UPLOAD
========================= */

.upload-area {
    border: 2px dashed #34404d;
    border-radius: 12px;
    padding: 45px 25px;
    text-align: center;
    background: #151b22;
}

.upload-area:hover {
    border-color: #3288e8;
}

.upload-icon {
    font-size: 38px;
    margin-bottom: 12px;
}

.upload-title {
    font-size: 18px;
    font-weight: 800;
}

.upload-description {
    color: #7f8996;
    font-size: 13px;
    margin: 8px auto 20px;
    max-width: 500px;
    line-height: 1.6;
}

.file-list {
    margin-top: 18px;
    text-align: left;
}

.file-item {
    background: #1b222b;
    border: 1px solid #2b3440;
    border-radius: 7px;
    padding: 10px 12px;
    margin-bottom: 7px;
    font-size: 12px;
    color: #b9c1ca;
}

/* =========================
   REVIEW
========================= */

.review-box {
    background: #151b22;
    border: 1px solid #303844;
    border-radius: 10px;
    padding: 18px;
    margin-top: 15px;
}

.review-warning {
    background: #282319;
    border: 1px solid #594a2b;
    color: #d8c47e;
    border-radius: 8px;
    padding: 13px;
    font-size: 12px;
    margin-bottom: 15px;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 900px;
    max-height: 92vh;
    overflow-y: auto;
    background: #11161d;
    border: 1px solid #303844;
    border-radius: 13px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-title {
    font-size: 21px;
    font-weight: 800;
}

.close-btn {
    background: transparent;
    border: 0;
    color: #7f8996;
    font-size: 23px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #cdd3db;
    margin-bottom: 7px;
}

.score-inputs {
    display: grid;
    grid-template-columns: 1fr 45px 1fr;
    gap: 10px;
    align-items: center;
}

.score-inputs span {
    text-align: center;
    color: #7f8996;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

/* =========================
   PLAYERS
========================= */

.player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
    gap: 12px;
    margin-top: 18px;
}

.player-card {
    background: #171d25;
    border: 1px solid #252c35;
    border-radius: 10px;
    padding: 15px;
}

.player-name {
    font-weight: 800;
    font-size: 16px;
}

.player-club {
    color: #7f8996;
    font-size: 13px;
    margin-top: 5px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    .match-summary-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .player-entry {
        grid-template-columns: 1fr 80px 65px 65px;
    }

}

@media (max-width: 750px) {

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #252c35;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .match-row-main {
        grid-template-columns: 1fr 1fr;
    }

    .entry-choice-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .type-buttons,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .match-summary-grid {
        grid-template-columns: 1fr 1fr;
    }

}

</style>
</head>


<body>

<aside class="sidebar">

    <div class="logo">
        Career Mode <span>Hub</span>
    </div>

    <div class="nav-title">
        Career
    </div>

    <button
        class="nav-btn active"
        data-page="dashboard"
        onclick="showPage('dashboard')"
    >
        Dashboard
    </button>

    <div id="careerNavigation">

        <button class="nav-btn disabled" data-page="mycareer" onclick="showPage('mycareer')">
            My Career
        </button>

        <button class="nav-btn disabled" data-page="matches" onclick="showPage('matches')">
            Matches
        </button>

        <button class="nav-btn disabled" data-page="squad" onclick="showPage('squad')">
            Squad
        </button>

        <button class="nav-btn disabled" data-page="players" onclick="showPage('players')">
            Players
        </button>

        <button class="nav-btn disabled" data-page="youth" onclick="showPage('youth')">
            Youth Academy
        </button>

        <button class="nav-btn disabled" data-page="transfers" onclick="showPage('transfers')">
            Transfers
        </button>

        <button class="nav-btn disabled" data-page="competitions" onclick="showPage('competitions')">
            Competitions
        </button>

        <button class="nav-btn disabled" data-page="league" onclick="showPage('league')">
            League Centre
        </button>

        <button class="nav-btn disabled" data-page="past" onclick="showPage('past')">
            Past Seasons
        </button>

        <button class="nav-btn disabled" data-page="trophies" onclick="showPage('trophies')">
            Trophy Cabinet
        </button>

        <button class="nav-btn disabled" data-page="national" onclick="showPage('national')">
            National Team
        </button>

    </div>

</aside>


<main class="main">

    <div id="pageContent"></div>

</main>


<div id="modalContainer"></div>


<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let allPlayers = [];

let fc27Leagues = [];

let fc27ClubsByLeague = {};

let careers = [];

let currentCareerId = null;

let setupClubType = "original";

let selectedLeague = "";

let selectedClub = "";

let selectedCountry = "";

let selectedContinent = "";

let manualPlayers = [];


/* =========================================================
   STORAGE
========================================================= */

function loadCareers() {

    try {

        const saved =
            localStorage.getItem(
                "careerModeHubCareers"
            );

        if (saved) {

            careers = JSON.parse(saved);

            /*
             * Compatibility:
             * If an older career was created before
             * matches/player data existed, make sure
             * those arrays exist.
             */

            careers.forEach(career => {

                if (!Array.isArray(career.matches)) {
                    career.matches = [];
                }

                if (!Array.isArray(career.squad)) {
                    career.squad = [];
                }

                if (!Array.isArray(career.transfers)) {
                    career.transfers = [];
                }

                if (!Array.isArray(career.trophies)) {
                    career.trophies = [];
                }

            });

        }

    } catch(error) {

        careers = [];

    }

}


function saveCareers() {

    localStorage.setItem(
        "careerModeHubCareers",
        JSON.stringify(careers)
    );

}


/* =========================================================
   CURRENT CAREER
========================================================= */

function getCurrentCareer() {

    return careers.find(
        career =>
            career.id === currentCareerId
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page) {

    if (
        page !== "dashboard" &&
        !currentCareerId
    ) {

        renderDashboard();

        return;

    }


    document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

            button.classList.remove("active");

            if (
                button.dataset.page === page
            ) {

                button.classList.add("active");

            }

        });


    if (page === "dashboard") {

        renderDashboard();

    }

    else if (page === "mycareer") {

        renderCareerHome();

    }

    else if (page === "matches") {

        renderMatches();

    }

    else if (page === "players") {

        renderPlayers();

    }

    else {

        renderPlaceholder(
            pageTitle(page),
            "This section will be built next."
        );

    }

}


function pageTitle(page) {

    const titles = {

        squad: "Squad",
        youth: "Youth Academy",
        transfers: "Transfers",
        competitions: "Competitions",
        league: "League Centre",
        past: "Past Seasons",
        trophies: "Trophy Cabinet",
        national: "National Team"

    };

    return titles[page] || page;

}


/* =========================================================
   NAVIGATION STATE
========================================================= */

function updateNavigation() {

    document
        .querySelectorAll(
            "#careerNavigation .nav-btn"
        )
        .forEach(button => {

            if (currentCareerId) {

                button.classList.remove(
                    "disabled"
                );

            }

            else {

                button.classList.add(
                    "disabled"
                );

            }

        });

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

    currentCareerId = null;

    updateNavigation();


    document.getElementById(
        "pageContent"
    ).innerHTML = `

        <div class="topbar">

            <div>

                <div class="page-title">
                    Dashboard
                </div>

                <div class="page-subtitle">
                    Choose a career mode or create a new one.
                </div>

            </div>


            <button
                class="primary-btn"
                onclick="startNewCareer()"
            >
                + New Career
            </button>

        </div>


        <div style="margin-bottom:22px">

            <div class="panel-title">
                Your Careers
            </div>

            <div class="panel-subtitle">
                Run multiple career modes at the same time.
            </div>

        </div>


        ${
            careers.length === 0

            ?

            `

            <div class="empty-state">

                <h2>
                    No careers yet
                </h2>

                <p>
                    Create your first Career Mode save to get started.
                </p>

                <button
                    class="primary-btn"
                    onclick="startNewCareer()"
                >
                    Create Career
                </button>

            </div>

            `

            :

            `

            <div class="careers-grid">

                ${careers
                    .map(createCareerCard)
                    .join("")}

            </div>

            `

        }

    `;

}


function createCareerCard(career) {

    return `

        <div class="career-card">

            <div class="career-name">
                ${escapeHTML(career.managerName)}
            </div>

            <div class="career-club">
                ${escapeHTML(career.clubName)}
            </div>

            <div class="career-league">
                ${escapeHTML(career.league)}
            </div>


            <div class="career-season">

                <span>
                    Current Year
                </span>

                <span class="season-value">
                    ${escapeHTML(career.currentSeason)}
                </span>

            </div>


            <div class="career-season">

                <span>
                    Matches
                </span>

                <span class="season-value">
                    ${career.matches.length}
                </span>

            </div>


            <div class="career-season">

                <span>
                    National Team
                </span>

                <span class="season-value">
                    ${
                        career.nationalTeam
                        ? escapeHTML(

function selectClubType(type) {

    setupClubType = type;


    const original =
        document.getElementById(
            "originalClubButton"
        );

    const create =
        document.getElementById(
            "createClubButton"
        );

    const clubSection =
        document.getElementById(
            "clubSection"
        );

    const customSection =
        document.getElementById(
            "customClubSection"
        );


    if (type === "original") {

        original.classList.add("selected");

        create.classList.remove("selected");

        clubSection.style.display = "block";

        customSection.style.display = "none";

    }

    else {

        original.classList.remove("selected");

        create.classList.add("selected");

        clubSection.style.display = "none";

        customSection.style.display = "block";

    }

}


/* =========================================================
   LEAGUE SEARCH
========================================================= */

function openLeagueResults() {

    searchLeague(
        document.getElementById(
            "leagueSearch"
        ).value
    );

}


function searchLeague(query) {

    const results =
        document.getElementById(
            "leagueResults"
        );

    if (!results) return;


    const q =
        query
            .trim()
            .toLowerCase();


    const matches =
        fc27Leagues
            .filter(
                league =>
                    league
                        .toLowerCase()
                        .includes(q)
            )
            .slice(0,80);


    results.innerHTML =
        matches.length

        ?

        matches
            .map(
                league => `

                    <div
                        class="search-option"
                        onclick="chooseLeague('${escapeJS(league)}')"
                    >
                        ${escapeHTML(league)}
                    </div>

                `
            )
            .join("")

        :

        `
            <div class="search-option">
                No FC 27 leagues found.
            </div>
        `;


    results.classList.add("open");

}


function chooseLeague(league) {

    selectedLeague = league;

    selectedClub = "";


    document.getElementById(
        "leagueSearch"
    ).value = league;


    document.getElementById(
        "leagueResults"
    ).classList.remove("open");


    const clubInput =
        document.getElementById(
            "clubSearch"
        );


    clubInput.disabled = false;

    clubInput.value = "";

    clubInput.placeholder =
        "Search clubs in this league...";

}

    if (!selectedLeague) return;

    searchClub(

            "clubSearch"

}


function searchClub(query) {

    if (!selectedLeague) return;


    const results =
        document.getElementById(
            "clubResults"
        );


    const clubs =
        fc27ClubsByLeague[
            selectedLeague
        ] || [];


    const q =
        query
            .trim()
            .toLowerCase();


    const matches =
        clubs
            .filter(
                club =>
                    club
                        .toLowerCase()
                        .includes(q)
            )
            .slice(0,100);


    results.innerHTML =
        matches.length

                club => `

/* =========================================================
   CREATE CAREER
========================================================= */

function createCareer() {

    const manager =
        document.getElementById(
            "managerName"
        ).value.trim();


    if (!manager) {

        alert(
            "Please enter a manager name."
        );

        return;

    }


    if (!selectedLeague) {

        alert(
            "Please select a league."
        );

        return;

    }


    let club = "";


    if (setupClubType === "original") {

        if (!selectedClub) {

            alert(
                "Please select a club."
            );

            return;

        }

        club = selectedClub;

    }

    else {

        club =
            document.getElementById(
                "customClubName"
            ).value.trim();


        if (!club) {

            alert(
                "Please enter your custom club name."
            );

            return;

        }

    }


    const nationalChoice =
        document.getElementById(
            "nationalTeamChoice"
        ).value;


    if (
        nationalChoice === "add" &&
        !selectedCountry
    ) {

        alert(
            "Please select a national team."
        );

        return;

    }


    const career = {

        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .substring(2),

        managerName:
            manager,

        clubType:
            setupClubType,

        clubName:
            club,

        league:
            selectedLeague,

        currentSeason:
            "2026/27",

        seasonNumber:
            1,

        nationalTeam:
            nationalChoice === "add"
            ? selectedCountry
            : null,

        continent:
            nationalChoice === "add"
            ? selectedContinent
            : null,

        leagueHistory: [
            {
                season: "2026/27",
                league: selectedLeague
            }
        ],

        seasonHistory: [],

        matches: [],

        transfers: [],

        trophies: [],

        squad: [],

        youthAcademy: []

    };


    careers.push(career);

    saveCareers();

    enterCareer(career.id);

}

/* =========================================================
   MATCHES
========================================================= */

function renderMatches() {

    const career =
        getCurrentCareer();


    if (!career) {

        renderDashboard();

        return;

    }


    const matches =
        [...career.matches]
            .sort(
                (a,b) =>
                    new Date(b.date) -
                    new Date(a.date)
            );


    const wins =
        matches.filter(
            match =>
                match.result === "W"
        ).length;


    const draws =
        matches.filter(
            match =>
                match.result === "D"
        ).length;


    const losses =
        matches.filter(
            match =>
                match.result === "L"
        ).length;


    const cleanSheets =
        matches.filter(
            match =>
                match.cleanSheet
        ).length;


    document.getElementById(
        "pageContent"
    ).innerHTML = `

        ${careerBanner(career)}


        <div class="topbar">

            <div>

                <div class="page-title">

                <div class="match-stat-number">${matches.length}</div>
            </div>

            <div class="match-stat">
                <div class="match-stat-label">Wins</div>
                <div class="match-stat-number">${wins}</div>
            </div>

            <div class="match-stat">

                <div class="match-stat-number">${draws}</div>
            </div>

            <div class="match-stat">
                <div class="match-stat-label">Losses</div>
                <div class="match-stat-number">${losses}</div>
            </div>

            <div class="match-stat">
                <div class="match-stat-label">Clean Sheets</div>
                <div class="match-stat-number">${cleanSheets}</div>
            </div>

        </div>


        <div class="panel">

            ${

/* =========================================================
   SAVE MANUAL MATCH
========================================================= */

function saveManualMatch() {

    const career =
        getCurrentCareer();


    if (!career) return;


    const opponent =
        document.getElementById(
            "matchOpponent"
        ).value.trim();


    if (!opponent) {

        alert(
            "Please enter the opponent."
        );

        return;

    }


    const goalsFor =
        Number(
            document.getElementById(
                "goalsFor"
            ).value || 0
        );


    const goalsAgainst =
        Number(
            document.getElementById(
                "goalsAgainst"
            ).value || 0
        );


    let result;


    if (goalsFor > goalsAgainst) {

        result = "W";

    }

    else if (
        goalsFor === goalsAgainst
    ) {

        result = "D";

    }

    else {

        result = "L";

    }


    const playerRows =
        document.querySelectorAll(
            "#manualPlayers .player-entry"
        );


    const players = [];


    playerRows.forEach(row => {

        const name =
            row.querySelector(
                '[data-field="name"]'
            ).value.trim();


        /*
         * Ignore completely empty rows.
         */

        if (!name) return;


        const rating =
            row.querySelector(
                '[data-field="rating"]'
            ).value;


        const goals =
            row.querySelector(
                '[data-field="goals"]'
            ).value;


        const assists =
            row.querySelector(
                '[data-field="assists"]'
            ).value;


        const cards =
            row.querySelector(
                '[data-field="cards"]'
            ).value;


        players.push({

            name: name,

            rating:
                rating === ""
                ? null
                : Number(rating),

            goals:
                goals === ""
                ? 0
                : Number(goals),

            assists:
                assists === ""
                ? 0
                : Number(assists),

            cards:
                cards || null

        });

    });


    const match = {

        id:
            createId(),

        season:
            career.currentSeason,

        date:
            document.getElementById(
                "matchDate"
            ).value,

        competition:
            document.getElementById(
                "matchCompetition"
            ).value,

        homeAway:
            document.getElementById(
                "matchHomeAway"
            ).value,

        opponent:
            opponent,

        goalsFor:
            goalsFor,

        goalsAgainst:
            goalsAgainst,

        result:
            result,

        cleanSheet:
            goalsAgainst === 0,

        entryMethod:
            "manual",

        players:
            players,

        aiSource:
            false

    };


    career.matches.push(match);

    saveCareers();

    closeModal();

    renderMatches();

}

/* =========================================================
   CSV
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            value = "";


            if (
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        if (
            row.some(
                cell =>
                    cell.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }


    if (!rows.length) {

        return [];

    }


    const headers =
        rows[0].map(
            header =>
                header.trim()
        );


    return rows
        .slice(1)
        .map(row => {

            const object = {};


            headers.forEach(
                (header,index) => {

                    object[header] =
                        row[index] !== undefined
                        ? row[index].trim()
                        : "";

                }
            );


            return object;

        });

}


function getPlayerValue(
    row,
    names
) {

    for (
        const name of names
    ) {

        if (
            row[name] !== undefined &&
            row[name] !== ""
        ) {

            return row[name];

        }

    }


    return "";

}


function calculateAge(
    birthdate
) {

    if (!birthdate) return "";


    const date =
        new Date(birthdate);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const now =
        new Date();


    let age =
        now.getFullYear() -
        date.getFullYear();


    const month =
        now.getMonth() -
        date.getMonth();


    if (
        month < 0 ||
        (
            month === 0 &&
            now.getDate() <
            date.getDate()
        )
    ) {

        age--;

    }


    return age;

}


function convertPlayer(row) {

    return {

        id:
            getPlayerValue(
                row,
                ["id"]
            ),

        rank:
            getPlayerValue(
                row,
                ["rank"]
            ),

        overallRating:
            getPlayerValue(
                row,
                [
                    "overallRating",
                    "overall",
                    "rating"
                ]
            ),

        firstName:
            getPlayerValue(
                row,
                [
                    "firstName",
                    "first_name"
                ]
            ),

        lastName:
            getPlayerValue(
                row,
                [
                    "lastName",
                    "last_name"
                ]
            ),

        commonName:
            getPlayerValue(
                row,
                [
                    "commonName",
                    "common_name"
                ]
            ),

        birthdate:
            getPlayerValue(
                row,
                ["birthdate"]
            ),

        age:
            calculateAge(
                getPlayerValue(
                    row,
                    ["birthdate"]
                )
            ),

        league:
            getPlayerValue(
                row,
                [
                    "leagueName",
                    "league"
                ]
            ),

        club:
            getPlayerValue(
                row,
                [
                    "team",
                    "club"
                ]
            ),

        nationality:
            getPlayerValue(
                row,
                ["nationality"]
            ),

        position:
            getPlayerValue(
                row,
                [
                    "positionShort",
                    "position"
                ]
            ),

        preferredFoot:
            getPlayerValue(
                row,
                ["preferredFoot"]
            ),

        avatarUrl:
            getPlayerValue(
                row,
                ["avatarUrl"]
            ),

        shieldUrl:
            getPlayerValue(
                row,
                ["shieldUrl"]
            )

    };

}


/* =========================================================
   BUILD FC27 LEAGUES
========================================================= */

function buildFC27LeagueDatabase() {

    const leagueSet =
        new Set();


    const clubsByLeague = {};


    allPlayers.forEach(
        player => {

            const league =
                player.league;

            const club =
                player.club;


            if (!league) return;


            leagueSet.add(
                league
            );


            if (
                !clubsByLeague[league]
            ) {

                clubsByLeague[league] =
                    new Set();

            }


            if (club) {

                clubsByLeague[
                    league
                ].add(club);

            }

        }
    );


    fc27Leagues =
        Array.from(
            leagueSet
        ).sort(
            (a,b) =>
                a.localeCompare(b)
        );


    fc27ClubsByLeague = {};


    Object.keys(
        clubsByLeague
    ).forEach(
        league => {

            fc27ClubsByLeague[
                league
            ] =
                Array.from(
                    clubsByLeague[
                        league
                    ]
                ).sort(
                    (a,b) =>
                        a.localeCompare(b)
                );

        }
    );

}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadDatabase() {

    try {

        const response =
            await fetch(
                "data/players.csv?cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load players.csv"
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        allPlayers =
            rows.map(
                convertPlayer
            );


        buildFC27LeagueDatabase();


        console.log(
            "Players loaded:",
            allPlayers.length
        );


    }

    catch(error) {

        console.error(
            "Database error:",
            error
        );

    }

}


/* =========================================================
   PROMOTION / RELEGATION FOUNDATION
========================================================= */

function updateCareerLeague(
    careerId,
    newLeague,
    newSeason
) {

    const career =
        careers.find(
            c =>
                c.id === careerId
        );


    if (!career) return;


    career.leagueHistory.push({

        season:
            newSeason,

        league:
            newLeague

    });


    career.league =
        newLeague;


    career.currentSeason =
        newSeason;


    career.seasonNumber =
        (career.seasonNumber || 1) + 1;


    saveCareers();


    if (
        currentCareerId === careerId
    ) {

        renderCareerHome();

    }

}


/* =========================================================
   HELPERS
========================================================= */

function createId() {

    return (
        Date.now().toString() +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


function todayDate() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


function formatDate(dateString) {

    if (!dateString) return "—";


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    return date.toLocaleDateString(
        "en-AU",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}


function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(value) {

    return String(
        value ?? ""
    )
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}
