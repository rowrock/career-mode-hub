<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Mode Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f5f7;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}
button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#11141b;border-right:1px solid #242936;padding:20px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:22px;font-weight:800;margin-bottom:24px}.brand span{color:#65e572}.nav button{width:100%;text-align:left;background:transparent;color:#aeb5c2;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#202530;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.muted{color:#8f97a6}.card{background:#141820;border:1px solid #262c38;border-radius:14px;padding:20px}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.btn{background:#65e572;color:#071009;font-weight:800;padding:10px 15px;border-radius:9px}.btn.secondary{background:#242a35;color:#fff}.btn.danger{background:#d94d5c;color:#fff}.btn.small{padding:7px 10px;font-size:13px}.stat{font-size:28px;font-weight:800}.section-title{font-size:19px;font-weight:800;margin:0 0 14px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:#aeb5c2;margin-bottom:6px}.field input,.field select{width:100%;background:#0d1016;color:#fff;border:1px solid #303744;border-radius:8px;padding:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-block;background:#242a35;border-radius:999px;padding:5px 9px;font-size:12px;color:#cbd1da}.empty{padding:35px;text-align:center;color:#8f97a6}.career-card{transition:.15s}.career-card:hover{border-color:#65e572;transform:translateY(-1px)}.player-table,.match-table{width:100%;border-collapse:collapse}.player-table th,.player-table td,.match-table th,.match-table td{padding:9px;border-bottom:1px solid #292f3a;text-align:left;font-size:13px}.player-table th,.match-table th{color:#8f97a6}.modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#151922;border:1px solid #303744;border-radius:15px;width:min(1000px,100%);max-height:92vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:#282e39;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{padding:25px;background:#1d222c;border:1px solid #303744;border-radius:12px;text-align:left}.mode:hover{border-color:#65e572}.mode strong{display:block;font-size:17px;margin-bottom:6px}.searchbox{position:relative}.results{position:absolute;z-index:30;left:0;right:0;top:100%;background:#171c25;border:1px solid #39414e;max-height:210px;overflow:auto}.result{padding:9px 10px;cursor:pointer}.result:hover{background:#252c37}.tag-list{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#222935;border-radius:7px;padding:6px 8px}.team-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:350px;overflow:auto}.team-option{background:#1b2029;padding:8px;border-radius:7px;cursor:pointer}.team-option.selected{outline:2px solid #65e572}.upload{border:1px dashed #4a5261;border-radius:10px;padding:20px;text-align:center}.file-list{margin-top:10px}.file-item{padding:7px 0;color:#b9c0cb}.review{background:#0f131a;border-radius:10px;padding:12px}.theme{padding:16px;border-radius:12px;border:1px solid #333946}.theme-premier{background:linear-gradient(135deg,#182044,#11151e)}.theme-ucl{background:linear-gradient(135deg,#102b50,#131724)}.theme-europa{background:linear-gradient(135deg,#3b2411,#17151a)}.theme-fa{background:linear-gradient(135deg,#24143d,#16141c)}.theme-carabao{background:linear-gradient(135deg,#17372d,#13181a)}.theme-int{background:linear-gradient(135deg,#242426,#13151a)}.theme-world{background:linear-gradient(135deg,#3b1d20,#171419)}.calendar-list{display:grid;gap:10px}.calendar-event{display:flex;gap:15px;align-items:center}.datebox{width:62px;text-align:center;background:#0b0e13;border-radius:9px;padding:8px;flex:none}.fav{background:transparent;color:#8f97a6;font-size:24px}.fav.on{color:#ffd34e}.notice{padding:12px;border-radius:9px;background:#302715;color:#f1d998;margin-bottom:14px}.hidden{display:none!important}@media(max-width:850px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px);padding:18px}.grid2,.grid3,.grid4,.mode-grid{grid-template-columns:1fr}.team-list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Career Mode <span>Hub</span></div>
  <div id="careerLabel" class="muted" style="font-size:12px;margin-bottom:12px"></div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>

<script>
const STORE="careerModeHubCareers";
let careers=JSON.parse(localStorage.getItem(STORE)||"[]");
let currentCareerId=localStorage.getItem("careerModeHubCurrent")||null;
let allPlayers=[], teams=[], leagues=[], countries=[];
let page="Dashboard", opponentSearch="", selectedOpp="";
let uploadedMatchFiles=[], uploadedCalendarFiles=[];
let modalData={};

const countryByContinent={
 Europe:["England","Spain","France","Germany","Italy","Portugal","Netherlands","Belgium","Scotland","Ireland","Wales","Northern Ireland","Austria","Switzerland","Turkey","Greece","Croatia","Serbia","Denmark","Sweden","Norway","Poland","Ukraine","Czech Republic","Romania"],
 Oceania:["Australia","New Zealand"],
 South America:["Argentina","Brazil","Chile","Colombia","Uruguay","Ecuador","Peru","Paraguay","Bolivia","Venezuela"],
 North America:["Canada","Mexico","United States","Costa Rica","Panama"],
 Africa:["Nigeria","Ghana","Senegal","Morocco","Egypt","Cameroon","Ivory Coast","South Africa","Algeria","Tunisia"],
 Asia:["Japan","South Korea","Saudi Arabia","Qatar","Iran","Iraq","China","Australia"]
};

function save(){localStorage.setItem(STORE,JSON.stringify(careers));localStorage.setItem("careerModeHubCurrent",currentCareerId||"")}
function career(){return careers.find(c=>c.id===currentCareerId)}
function esc(x=""){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(){return Math.random().toString(36).slice(2,9)}
function currentSeason(){return career()?.currentSeason||"2026/27"}

function convertRow(r){
 return {id:r.id||uid(),name:(r.commonName||`${r.firstName||""} ${r.lastName||""}`).trim(),firstName:r.firstName||"",lastName:r.lastName||"",overall:+r.overallRating||0,league:r.leagueName||"",club:r.team||"",nationality:r.nationality||"",position:r.position||"",positionShort:r.positionShort||"",foot:r.preferredFoot||"",avatar:r.avatarUrl||""}
}
function parseCSV(text){
 const lines=text.split(/\r?\n/).filter(Boolean), out=[];
 if(!lines.length)return out;
 const headers=lines[0].split(",").map(x=>x.trim());
 for(let i=1;i<lines.length;i++){
   let row=[],cur="",q=false;
   for(const ch of lines[i]){
     if(ch==='"')q=!q; else if(ch===","&&!q){row.push(cur);cur=""} else cur+=ch
   } row.push(cur);
   if(row.length<headers.length)continue;
   const o={};headers.forEach((h,j)=>o[h]=row[j]?.trim().replace(/^"|"$/g,"")||"");out.push(convertRow(o))
 }
 return out
}
async function loadPlayers(){
 try{const t=await fetch("data/players.csv").then(r=>r.text());allPlayers=parseCSV(t);buildPools()}catch(e){console.warn("players.csv not loaded",e)}
}
function buildPools(){
 const tm=new Map(),lg=new Set();
 allPlayers.forEach(p=>{if(p.club)tm.set(p.club,p.league);if(p.league)lg.add(p.league)});
 teams=[...tm.entries()].map(([name,league])=>({name,league})).sort((a,b)=>a.name.localeCompare(b.name));
 leagues=[...lg].sort();
 countries=[...new Set(allPlayers.map(p=>p.nationality).filter(Boolean))].sort();
}

function initCareer(c){
 c.matches??=[];c.transfers??=[];c.trophies??=[];c.squad??=[];c.youthAcademy??=[];
 c.calendar??=[];c.seasonTeams??={};c.competitionTeams??={};c.seasonHistory??=[];c.leagueHistory??=[];
}
function openCareer(id){currentCareerId=id;page="Dashboard";initCareer(career());save();render()}
function navItems(){return ["Dashboard","My Career","Matches","Calendar","Squad","Players","Youth Academy","Transfers","Competitions","League Centre","Past Seasons","Trophy Cabinet","National Team"]}

function renderNav(){
 const n=document.getElementById("nav");
 if(!currentCareerId){n.innerHTML=`<button class="active" onclick="page='Dashboard';render()">Career Modes</button>`;return}
 n.innerHTML=navItems().map(x=>`<button class="${page===x?"active":""}" onclick="page='${x}';render()">${x}</button>`).join("")+
 `<button style="margin-top:15px" onclick="currentCareerId=null;page='Dashboard';save();render()">← All Careers</button>`;
 document.getElementById("careerLabel").textContent=career()?.managerName+" • "+career()?.clubName||"";
}
function render(){renderNav();const m=document.getElementById("main");if(!currentCareerId)return renderHome(m);initCareer(career());if(page==="Dashboard")renderCareerDashboard(m);else if(page==="Matches")renderMatches(m);else if(page==="Calendar")renderCalendar(m);else if(page==="Players")renderPlayers(m);else if(page==="My Career")renderMyCareer(m);else renderPlaceholder(m,page)}
function renderHome(m){
 m.innerHTML=`<div class="top"><div><h1>Career Modes</h1><p class="muted">Create and manage multiple EA FC careers.</p></div><button class="btn" onclick="openCareerSetup()">+ New Career</button></div>
 <div class="grid grid2">${careers.length?careers.map(c=>`<div class="card career-card" onclick="openCareer('${c.id}')"><div class="between"><h2>${esc(c.managerName)}</h2><span class="pill">${esc(c.currentSeason)}</span></div><div style="font-size:20px;font-weight:800">${esc(c.clubName)}</div><p class="muted">${esc(c.league)} • ${esc(c.nationalTeam||"No national team")}</p><button class="btn small">Open Career</button></div>`).join(""):`<div class="card empty">No careers yet. Create your first career.</div>`}</div>`;
}
function renderCareerDashboard(m){
 const c=career(), matches=c.matches||[], w=matches.filter(x=>x.result==="W").length,d=matches.filter(x=>x.result==="D").length,l=matches.filter(x=>x.result==="L").length;
 const setup=!(c.seasonTeams?.[c.currentSeason]?.[c.league]?.length);
 m.innerHTML=`<div class="top"><div><h1>${esc(c.clubName)}</h1><p class="muted">${esc(c.managerName)} • ${esc(c.league)} • ${esc(c.currentSeason)}</p></div><button class="btn secondary" onclick="openSeasonSetup()">Season Setup</button></div>
 ${setup?`<div class="notice"><b>Season setup needed:</b> select the teams in ${esc(c.league)} for ${esc(c.currentSeason)}. This controls league opponents.</div>`:""}
 <div class="grid grid4"><div class="card"><div class="muted">Matches</div><div class="stat">${matches.length}</div></div><div class="card"><div class="muted">Wins</div><div class="stat">${w}</div></div><div class="card"><div class="muted">Draws</div><div class="stat">${d}</div></div><div class="card"><div class="muted">Losses</div><div class="stat">${l}</div></div></div>
 <div class="grid grid2" style="margin-top:16px"><div class="card"><h3 class="section-title">Quick Actions</h3><div class="row"><button class="btn" onclick="openManualMatchModal()">Add Match</button><button class="btn secondary" onclick="page='Calendar';render()">Open Calendar</button><button class="btn secondary" onclick="openSeasonSetup()">Set Up Season</button></div></div><div class="card"><h3 class="section-title">Career</h3><p class="muted">Current team: ${esc(c.clubName)}<br>League: ${esc(c.league)}<br>Season: ${esc(c.currentSeason)}</p></div></div>`;
}

function renderMatches(m){
 const c=career(), ms=[...(c.matches||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 m.innerHTML=`<div class="top"><div><h1>Matches</h1><p class="muted">Enter matches manually or upload Match Facts screenshots.</p></div><div class="row"><button type="button" class="btn secondary" onclick="openMatchChoice()">Choose Entry Method</button><button type="button" class="btn" onclick="openManualMatchModal()">+ Manual Entry</button></div></div>
 <div class="card"><div class="grid grid3"><div><span class="muted">Played</span><div class="stat">${ms.length}</div></div><div><span class="muted">Clean sheets</span><div class="stat">${ms.filter(x=>+x.goalsAgainst===0).length}</div></div><div><span class="muted">AI imports</span><div class="stat">${ms.filter(x=>x.source==="ai").length}</div></div></div></div>
 <div class="card" style="margin-top:16px"><h3 class="section-title">Match History</h3>${ms.length?`<table class="match-table"><tr><th>Date</th><th>Competition</th><th>Opponent</th><th>Score</th><th>Result</th><th>Source</th><th></th></tr>${ms.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.competition)}</td><td>${esc(x.homeAway==="Home"?x.opponent:"@ "+x.opponent)}</td><td>${x.goalsFor}-${x.goalsAgainst}</td><td><span class="pill">${x.result}</span></td><td>${x.source==="ai"?"AI":"Manual"}</td><td><button class="btn small secondary" onclick="viewMatch('${x.id}')">View</button></td></tr>`).join("")}</table>`:`<div class="empty">No matches yet.</div>`}</div>`;
}
function renderCalendar(m){
 const c=career(), events=[...(c.calendar||[])].sort((a,b)=>a.date.localeCompare(b.date));
 m.innerHTML=`<div class="top"><div><h1>Calendar</h1><p class="muted">Upload your career calendar screenshots and keep every fixture in one place.</p></div><button class="btn" onclick="openCalendarUpload()">+ Upload Calendar</button></div>
 <div class="card"><div class="upload"><b>AI calendar import</b><p class="muted">Upload one or multiple screenshots of your calendar. The secure AI connection will extract dates, opponents and competitions.</p><button class="btn secondary" onclick="openCalendarUpload()">Choose Screenshots</button></div></div>
 <div class="card" style="margin-top:16px"><div class="between"><h3 class="section-title">Fixtures</h3><button class="btn small secondary" onclick="addCalendarEvent()">+ Add Manually</button></div>
 <div class="calendar-list">${events.length?events.map(e=>`<div class="theme ${themeClass(e.competition)} calendar-event"><div class="datebox"><b>${new Date(e.date+"T12:00:00").getDate()}</b><br><span class="muted">${new Date(e.date+"T12:00:00").toLocaleString("en",{month:"short"})}</span></div><div style="flex:1" onclick="viewCalendarEvent('${e.id}')"><b>${esc(e.opponent)}</b><div class="muted">${e.homeAway==="Home"?"vs":"@"} • ${esc(e.competition)}</div></div><button class="fav ${e.favourite?"on":""}" onclick="toggleFavourite('${e.id}')">${e.favourite?"★":"☆"}</button></div>`).join(""):`<div class="empty">No fixtures yet. Upload your calendar or add one manually.</div>`}</div></div>`;
}
function renderPlayers(m){
 const q=(window.playerSearch||"").toLowerCase(), arr=allPlayers.filter(p=>!q||`${p.name} ${p.club} ${p.nationality}`.toLowerCase().includes(q)).slice(0,150);
 m.innerHTML=`<div class="top"><div><h1>Players</h1><p class="muted">${allPlayers.length.toLocaleString()} players loaded from data/players.csv</p></div><input style="max-width:330px" placeholder="Search player, club or nationality" value="${esc(window.playerSearch||"")}" oninput="window.playerSearch=this.value;renderPlayers(document.getElementById('main'))"></div>
 <div class="card"><table class="player-table"><tr><th>Player</th><th>OVR</th><th>Position</th><th>Club</th><th>League</th><th>Nation</th></tr>${arr.map(p=>`<tr><td>${esc(p.name)}</td><td><b>${p.overall||"—"}</b></td><td>${esc(p.positionShort||p.position||"—")}</td><td>${esc(p.club||"Free Agent")}</td><td>${esc(p.league||"—")}</td><td>${esc(p.nationality||"—")}</td></tr>`).join("")}</table></div>`;
}
function renderMyCareer(m){const c=career();m.innerHTML=`<div class="top"><h1>My Career</h1></div><div class="card"><div class="grid grid2"><div><span class="muted">Manager</span><h2>${esc(c.managerName)}</h2></div><div><span class="muted">Club</span><h2>${esc(c.clubName)}</h2></div><div><span class="muted">League</span><h2>${esc(c.league)}</h2></div><div><span class="muted">Season</span><h2>${esc(c.currentSeason)}</h2></div></div><hr style="border-color:#292f3a"><button class="btn secondary" onclick="openSeasonSetup()">Season Setup / Teams</button> <button class="btn secondary" onclick="startNextSeason()">Start Next Season</button></div>`}
function renderPlaceholder(m,title){m.innerHTML=`<div class="top"><h1>${esc(title)}</h1></div><div class="card empty">This section is ready for the next build. Your career data is already stored per career.</div>`}

function openModal(inner){document.getElementById("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

function openCareerSetup(){
 openModal(`<div class="modal-head"><h2>New Career</h2><button type="button" class="close" onclick="closeModal()">×</button></div>
 <div class="field"><label>Manager name</label><input id="newManager" placeholder="Your manager"></div>
 <div class="field"><label>Club type</label><select id="newClubType" onchange="document.getElementById('clubField').classList.toggle('hidden',this.value!=='Original Club');document.getElementById('customClubField').classList.toggle('hidden',this.value!=='Create a Club')"><option>Original Club</option><option>Create a Club</option></select></div>
 <div class="field"><label>League</label><select id="newLeague">${leagues.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>
 <div class="field" id="clubField"><label>Club</label><select id="newClub">${teams.map(x=>`<option value="${esc(x.name)}" data-league="${esc(x.league)}">${esc(x.name)} — ${esc(x.league)}</option>`).join("")}</select></div>
 <div class="field hidden" id="customClubField"><label>Custom club name</label><input id="customClub" placeholder="My FC"></div>
 <div class="field"><label>National team</label><select id="natMode" onchange="document.getElementById('natFields').classList.toggle('hidden',this.value==='None')"><option>None</option><option>Add National Team</option></select></div>
 <div id="natFields" class="hidden"><div class="field"><label>Continent</label><select id="continent" onchange="fillCountries()"><option>Europe</option><option>Oceania</option><option>South America</option><option>North America</option><option>Africa</option><option>Asia</option></select></div><div class="field"><label>Country</label><select id="country"></select></div></div>
 <button class="btn" onclick="createCareer()">Create Career</button>`);
 fillCountries();
}
function fillCountries(){const el=document.getElementById("country");if(!el)return;const cont=document.getElementById("continent").value;const arr=[...new Set([...(countryByContinent[cont]||[]),...countries.filter(x=>(countryByContinent[cont]||[]).includes(x))])].sort();el.innerHTML=arr.map(x=>`<option>${esc(x)}</option>`).join("")}
function createCareer(){
 const type=document.getElementById("newClubType").value, league=document.getElementById("newLeague").value;
 const club=type==="Create a Club"?document.getElementById("customClub").value.trim():document.getElementById("newClub").value;
 if(!club)return alert("Please enter/select a club.");
 const c={id:uid(),managerName:document.getElementById("newManager").value.trim()||"Manager",clubType:type,clubName:club,league,currentSeason:"2026/27",seasonNumber:1,nationalTeam:document.getElementById("natMode").value==="None"?"":document.getElementById("country")?.value||"",continent:document.getElementById("continent")?.value||"",matches:[],calendar:[],transfers:[],trophies:[],squad:[],youthAcademy:[],seasonTeams:{},competitionTeams:{},seasonHistory:[],leagueHistory:[]};
 careers.push(c);currentCareerId=c.id;initCareer(c);save();closeModal();page="Dashboard";render();setTimeout(openSeasonSetup,100);
}

function openSeasonSetup(){
 const c=career(); const existing=c.seasonTeams?.[c.currentSeason]?.[c.league]||[];
 openModal(`<div class="modal-head"><h2>Set Up ${esc(c.currentSeason)}</h2><button type="button" class="close" onclick="closeModal()">×</button></div>
 <p class="muted">Select every team in <b>${esc(c.league)}</b> for this season. League matches will only allow these opponents.</p>
 <div class="row"><button class="btn secondary" type="button" onclick="document.getElementById('leagueScreenshotInput').click()">Upload League Screenshots</button><input id="leagueScreenshotInput" type="file" accept="image/*" multiple class="hidden" onchange="leagueScreenshotNotice(this.files)"></div><p id="leagueNotice" class="muted"></p>
 <div class="field" style="margin-top:15px"><label>Search teams</label><input id="teamSearch" oninput="filterSeasonTeams()" placeholder="Search team"></div>
 <div id="teamList" class="team-list">${renderTeamOptions(existing,"")}</div>
 <div class="row" style="margin-top:16px"><button class="btn" onclick="saveSeasonTeams()">Save Season Teams</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);
}
function renderTeamOptions(selected,q){
 const c=career(), pool=teams.filter(t=>t.league===c.league || (c.league==="Premier League"&&t.league==="Premier League")).filter(t=>t.name.toLowerCase().includes(q.toLowerCase()));
 return pool.map(t=>`<div class="team-option ${selected.includes(t.name)?"selected":""}" data-team="${esc(t.name)}" onclick="this.classList.toggle('selected')">${esc(t.name)}</div>`).join("")||`<div class="empty">No teams found in the player database for this league.</div>`;
}
function filterSeasonTeams(){const q=document.getElementById("teamSearch").value;const selected=[...document.querySelectorAll(".team-option.selected")].map(x=>x.dataset.team);document.getElementById("teamList").innerHTML=renderTeamOptions(selected,q)}
function leagueScreenshotNotice(files){document.getElementById("leagueNotice").textContent=`${files.length} screenshot(s) selected. AI extraction needs the secure backend connection before team names can be read automatically.`}
function saveSeasonTeams(){const c=career();const selected=[...document.querySelectorAll(".team-option.selected")].map(x=>x.dataset.team);if(c.clubName&&!selected.includes(c.clubName))selected.push(c.clubName);c.seasonTeams[c.currentSeason]??={};c.seasonTeams[c.currentSeason][c.league]=selected;save();closeModal();render()}
function startNextSeason(){const c=career();const y=parseInt(c.currentSeason.slice(0,4))+1;c.seasonHistory.push({season:c.currentSeason,club:c.clubName,league:c.league});c.currentSeason=`${y}/${String(y+1).slice(2)}`;c.seasonNumber=(c.seasonNumber||1)+1;save();render();setTimeout(openSeasonSetup,100)}

function competitionList(){
 const c=career(), a=[c.league];
 if(c.league.toLowerCase().includes("england")||/premier|championship|league one|league two/i.test(c.league)){a.push("FA Cup","Carabao Cup")}
 a.push("UEFA Champions League","UEFA Europa League","UEFA Conference League","UEFA Super Cup","FIFA Club World Cup","International Friendly","World Cup","European Championship");
 return [...new Set(a)]
}
function teamsForCompetition(comp){
 const c=career();
 if(comp===c.league)return c.seasonTeams?.[c.currentSeason]?.[c.league]||[];
 if(comp==="FA Cup"||comp==="Carabao Cup")return [...new Set(teams.filter(t=>t.league).map(t=>t.name))].sort();
 if(comp.includes("International")||comp==="World Cup"||comp==="European Championship")return countries;
 return [...new Set(teams.map(t=>t.name))].sort();
}
function openMatchChoice(){openModal(`<div class="modal-head"><h2>Add Match</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="mode-grid"><button type="button" class="mode" onclick="closeModal();openManualMatchModal()"><strong>✍ Manual Entry</strong><span class="muted">Enter the match and any player ratings/stats you have. Every player rating is optional.</span></button><button type="button" class="mode" onclick="closeModal();openMatchUpload()"><strong>📷 Upload Match Facts</strong><span class="muted">Upload one or multiple screenshots for AI extraction and review.</span></button></div>`)}
function openManualMatchModal(){
 const c=career();
 openModal(`<div class="modal-head"><h2>Manual Match Entry</h2><button type="button" class="close" onclick="closeModal()">×</button></div>
 <div class="grid grid2"><div class="field"><label>Date</label><input id="matchDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Competition</label><select id="matchComp" onchange="updateOpponentOptions()">${competitionList().map(x=>`<option>${esc(x)}</option>`).join("")}</select></div></div>
 <div class="grid grid2"><div class="field"><label>Home / Away</label><select id="matchHA"><option>Home</option><option>Away</option></select></div><div class="field"><label>Opponent (search)</label><div class="searchbox"><input id="oppInput" placeholder="Search opponent" oninput="showOpponentResults()" autocomplete="off"><div id="oppResults" class="results hidden"></div></div></div></div>
 <div class="grid grid2"><div class="field"><label>Goals for</label><input id="gf" type="number" min="0" value="0"></div><div class="field"><label>Goals against</label><input id="ga" type="number" min="0" value="0"></div></div>
 <h3 class="section-title">Player ratings & stats <span class="muted" style="font-size:12px">(all optional)</span></h3>
 <div class="muted" style="margin-bottom:10px">Add only the players you want. Ratings, goals, assists, minutes, cards and GK saves can all be left blank.</div>
 <div id="manualPlayers"></div><button class="btn secondary small" type="button" onclick="addManualPlayerRow()">+ Add Player</button>
 <div class="row" style="margin-top:18px"><button class="btn" type="button" onclick="saveManualMatch()">Save Match</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div>`);
 updateOpponentOptions();addManualPlayerRow();
}
function updateOpponentOptions(){const box=document.getElementById("oppInput");if(box){box.value="";selectedOpp="";showOpponentResults()}}
function showOpponentResults(){
 const inp=document.getElementById("oppInput"), box=document.getElementById("oppResults");if(!inp||!box)return;
 const comp=document.getElementById("matchComp").value,q=inp.value.toLowerCase(), arr=teamsForCompetition(comp).filter(x=>x.toLowerCase().includes(q)).slice(0,80);
 box.innerHTML=arr.map(x=>`<div class="result" onclick="selectOpponent('${esc(x).replace(/'/g,"&#39;")}')">${esc(x)}</div>`).join("")||`<div class="result muted">No opponent found</div>`;box.classList.remove("hidden")
}
function selectOpponent(x){selectedOpp=x;document.getElementById("oppInput").value=x;document.getElementById("oppResults").classList.add("hidden")}
function addManualPlayerRow(data={}){
 const id=uid(),wrap=document.getElementById("manualPlayers");
 const names=allPlayers.slice(0,500).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${esc(p.club)}</option>`).join("");
 wrap.insertAdjacentHTML("beforeend",`<div class="review player-row" data-row="${id}" style="margin-bottom:9px"><div class="grid grid4"><select class="p-name"><option value="">Select player</option>${names}</select><input class="p-rating" type="number" min="0" max="10" step=".1" placeholder="Rating"><input class="p-goals" type="number" min="0" placeholder="Goals"><input class="p-assists" type="number" min="0" placeholder="Assists"></div><div class="grid grid4" style="margin-top:7px"><input class="p-min" type="number" min="0" placeholder="Minutes"><input class="p-yellow" type="number" min="0" placeholder="Yellow"><input class="p-red" type="number" min="0" placeholder="Red"><input class="p-saves" type="number" min="0" placeholder="GK Saves"></div><button type="button" class="btn danger small" style="margin-top:7px" onclick="this.parentElement.remove()">Remove</button></div>`);
 const row=wrap.lastElementChild;if(data.playerId)row.querySelector(".p-name").value=data.playerId;
}
function saveManualMatch(){
 const c=career(), gf=+document.getElementById("gf").value||0,ga=+document.getElementById("ga").value||0;
 const rows=[...document.querySelectorAll(".player-row")].map(r=>{const id=r.querySelector(".p-name").value;if(!id)return null;const p=allPlayers.find(x=>String(x.id)===String(id));return {playerId:id,playerName:p?.name||"",rating:r.querySelector(".p-rating").value===""?null:+r.querySelector(".p-rating").value,goals:+r.querySelector(".p-goals").value||0,assists:+r.querySelector(".p-assists").value||0,minutes:+r.querySelector(".p-min").value||0,yellowCards:+r.querySelector(".p-yellow").value||0,redCards:+r.querySelector(".p-red").value||0,saves:+r.querySelector(".p-saves").value||0}}).filter(Boolean);
 const match={id:uid(),season:c.currentSeason,date:document.getElementById("matchDate").value,competition:document.getElementById("matchComp").value,homeAway:document.getElementById("matchHA").value,opponent:selectedOpp||document.getElementById("oppInput").value,goalsFor:gf,goalsAgainst:ga,result:gf>ga?"W":gf<ga?"L":"D",source:"manual",screenshots:[],players:rows,extracted:false,favourite:false};
 if(!match.opponent)return alert("Please choose an opponent.");c.matches.push(match);save();closeModal();render();
}
function openMatchUpload(){
 uploadedMatchFiles=[];
 openModal(`<div class="modal-head"><h2>Upload Match Facts</h2><button type="button" class="close" onclick="closeModal()">×</button></div>
 <div class="upload"><input id="matchFiles" type="file" accept="image/*" multiple onchange="setMatchFiles(this.files)"><p class="muted">You can select one or multiple Match Facts screenshots.</p><div id="matchFileList"></div></div>
 <div class="notice" style="margin-top:15px"><b>AI connection:</b> the upload/review workflow is built, but this GitHub Pages frontend does not have a secure AI API connection yet. I won't pretend the screenshots have been analysed when they haven't.</div>
 <div class="row"><button class="btn secondary" type="button" onclick="alert('The secure AI backend still needs to be connected. Once connected, this button will extract the score, competition, opponent and every player rating/stat from the screenshots and open the editable review screen.')">Analyse with AI</button><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button></div>`);
}
function setMatchFiles(files){uploadedMatchFiles=[...files];document.getElementById("matchFileList").innerHTML=uploadedMatchFiles.map(f=>`<div class="file-item">📷 ${esc(f.name)}</div>`).join("")}
function viewMatch(id){
 const x=career().matches.find(m=>m.id===id);if(!x)return;
 openModal(`<div class="modal-head"><h2>${esc(x.opponent)} — ${esc(x.competition)}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><p>${esc(x.date)} • ${x.homeAway} • <b>${x.goalsFor}-${x.goalsAgainst}</b> • ${x.result}</p><h3 class="section-title">Players</h3>${x.players?.length?`<table class="player-table"><tr><th>Player</th><th>Rating</th><th>G</th><th>A</th><th>Min</th><th>YC</th><th>RC</th><th>Saves</th></tr>${x.players.map(p=>`<tr><td>${esc(p.playerName)}</td><td>${p.rating??"—"}</td><td>${p.goals||0}</td><td>${p.assists||0}</td><td>${p.minutes||"—"}</td><td>${p.yellowCards||0}</td><td>${p.redCards||0}</td><td>${p.saves||"—"}</td></tr>`).join("")}</table>`:`<div class="empty">No player data entered.</div>`}`);
}

function openCalendarUpload(){
 uploadedCalendarFiles=[];
 openModal(`<div class="modal-head"><h2>Upload Career Calendar</h2><button type="button" class="close" onclick="closeModal()">×</button></div>
 <div class="upload"><input id="calFiles" type="file" accept="image/*" multiple onchange="setCalendarFiles(this.files)"><p class="muted">Select all the calendar screenshots you have for the year.</p><div id="calFileList"></div></div>
 <div class="notice" style="margin-top:15px"><b>AI connection:</b> the screenshot upload UI is ready, but a secure AI backend is required before the screenshots can actually be read.</div>
 <div class="row"><button class="btn secondary" onclick="alert('Once the secure AI backend is connected, this will extract every scheduled match, date, opponent and competition and add them to your Calendar.')">Analyse Calendar with AI</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);
}
function setCalendarFiles(files){uploadedCalendarFiles=[...files];document.getElementById("calFileList").innerHTML=uploadedCalendarFiles.map(f=>`<div class="file-item">📷 ${esc(f.name)}</div>`).join("")}
function addCalendarEvent(){
 openModal(`<div class="modal-head"><h2>Add Calendar Fixture</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="grid grid2"><div class="field"><label>Date</label><input id="ceDate" type="date"></div><div class="field"><label>Competition</label><select id="ceComp">${competitionList().map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Home/Away</label><select id="ceHA"><option>Home</option><option>Away</option></select></div><div class="field"><label>Opponent</label><input id="ceOpp" placeholder="Opponent"></div></div><button class="btn" onclick="saveCalendarEvent()">Add Fixture</button>`);
}
function saveCalendarEvent(){const c=career(),date=document.getElementById("ceDate").value,opp=document.getElementById("ceOpp").value.trim();if(!date||!opp)return alert("Enter a date and opponent.");c.calendar.push({id:uid(),date,competition:document.getElementById("ceComp").value,opponent:opp,homeAway:document.getElementById("ceHA").value,favourite:false,source:"manual"});save();closeModal();render()}
function toggleFavourite(id){const e=career().calendar.find(x=>x.id===id);if(e){e.favourite=!e.favourite;save();render()}}
function viewCalendarEvent(id){const e=career().calendar.find(x=>x.id===id);if(!e)return;openModal(`<div class="modal-head"><h2>${esc(e.opponent)}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="theme ${themeClass(e.competition)}"><h2>${esc(e.competition)}</h2><p>${esc(e.date)} • ${e.homeAway==="Home"?"vs":"@"} ${esc(e.opponent)}</p><button class="fav ${e.favourite?"on":""}" onclick="toggleFavourite('${e.id}');closeModal()"> ${e.favourite?"★ Favourited":"☆ Favourite match"}</button></div>`)}
function themeClass(c=""){c=c.toLowerCase();if(c.includes("premier"))return"theme-premier";if(c.includes("champions"))return"theme-ucl";if(c.includes("europa"))return"theme-europa";if(c.includes("fa cup"))return"theme-fa";if(c.includes("carabao"))return"theme-carabao";if(c.includes("world cup"))return"theme-world";if(c.includes("international")||c.includes("european"))return"theme-int";return""}

document.addEventListener("click",e=>{if(!e.target.closest(".searchbox"))document.querySelectorAll(".results").forEach(x=>x.classList.add("hidden"))});
loadPlayers().finally(render);
</script>
</body>
</html>
